<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title data-zh="聊天页面 · 聊天记录工坊" data-en="Chat page · Chatlog Studio">聊天页面 · 聊天记录工坊</title>
<style>
/* app.css — 聊天页直接编排 + 右侧角色池 / 详细编辑器 + 设置侧栏 */
* { box-sizing: border-box; }
html, body { margin: 0; }
:root {
  --bg: #f4f5f7;
  --panel: #ffffff;
  --ink: #14171c;
  --ink-2: #3d444e;
  --muted: #6f7784;
  --faint: #98a0ac;
  --line: #e5e8ed;
  --line-2: #eef1f5;
  --accent: #0b84ff;
  --accent-soft: #eaf4ff;
  --danger: #d64545;
  --ok: #1f9d66;
  --radius: 16px;
  --font: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", "Segoe UI", system-ui, sans-serif;
}
body {
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 13px;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
* { scrollbar-width: thin; scrollbar-color: #cfd6e0 transparent; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: #d5dbe4; border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: #c2cad5; background-clip: padding-box; }
:focus-visible { outline: 2px solid rgba(11, 132, 255, .55); outline-offset: 2px; }
.only-narrow { display: none !important; }

/* ------------------------------------------------------------------ */
/* topbar                                                              */
/* ------------------------------------------------------------------ */
.topbar {
  flex: none;
  height: 64px;
  padding: 0 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  background: #fff;
  border-bottom: 1px solid var(--line);
  z-index: 20;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark {
  width: 36px; height: 36px; flex: none;
  border-radius: 11px;
  display: grid; place-items: center;
  color: #fff;
  background: linear-gradient(145deg, #2a9bff, #0067d6);
  box-shadow: 0 4px 10px -3px rgba(11, 132, 255, .55), inset 0 1px 0 rgba(255,255,255,.25);
}
.brand-text { min-width: 0; }
.brand-name { font-size: 14.5px; font-weight: 700; letter-spacing: -.01em; }
.brand-sub { font-size: 10.5px; color: var(--faint); margin-top: 1px; }
.top-actions { display: flex; align-items: center; gap: 7px; }
.top-divider { width: 1px; height: 20px; background: var(--line); margin: 0 2px; }

.segctl {
  display: inline-flex; align-items: center; gap: 2px;
  padding: 2px;
  background: #f1f3f6;
  border: 1px solid #e4e7ec;
  border-radius: 9px;
}
.segctl button {
  height: 28px; padding: 0 13px;
  border: 0; border-radius: 7px;
  background: transparent;
  color: #5f6773;
  font-size: 12px; font-weight: 650;
  cursor: pointer;
}
.segctl button.active { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(16,24,40,.1); }

.icon-btn {
  width: 34px; height: 34px;
  display: inline-grid; place-items: center;
  border: 1px solid transparent;
  border-radius: 9px;
  background: transparent;
  color: #4d5561;
  font-size: 16px;
  cursor: pointer;
}
.icon-btn:hover { background: #f2f4f8; color: var(--ink); }
.icon-btn:disabled { opacity: .32; cursor: not-allowed; }
.icon-btn:disabled:hover { background: transparent; }
.icon-btn.sm { width: 26px; height: 26px; border-radius: 7px; font-size: 13px; }

.btn {
  height: 34px; padding: 0 13px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: #fff;
  color: var(--ink);
  font-size: 12.5px; font-weight: 650;
  white-space: nowrap;
  cursor: pointer;
  transition: background .14s, border-color .14s, transform .08s;
}
.btn:hover { background: #f7f9fc; border-color: #d8dee7; }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover { background: #0074e6; border-color: #0074e6; }
.btn-dark { background: #15181d; border-color: #15181d; color: #fff; }
.btn-dark:hover { background: #262c35; border-color: #262c35; }
.btn-sm { height: 28px; padding: 0 10px; font-size: 11.5px; border-radius: 7px; gap: 4px; }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-ghost:hover { background: #f3f5f9; border-color: transparent; }
.btn-danger { color: var(--danger); border-color: #f0d4d4; }
.btn-danger:hover { background: #fdf5f5; border-color: #e7bcbc; }

/* ------------------------------------------------------------------ */
/* workspace                                                           */
/* ------------------------------------------------------------------ */
.workspace {
  flex: 1;
  min-height: 0;
  width: 100%;
  max-width: 1800px;
  margin: 0 auto;
  padding: 14px 18px 16px;
  display: grid;
  grid-template-columns: minmax(360px, 1fr) 236px minmax(400px, 500px);
  gap: 14px;
}
.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: 0 1px 2px rgba(16, 24, 40, .04);
}

/* stage ------------------------------------------------------------- */
.stage {
  min-height: 0;
  height: 100%;
  padding: 14px 14px 8px;
  display: flex;
  flex-direction: column;
}
.phone {
  flex: 1;
  min-height: 0;
  width: 100%;
  max-width: 432px;
  margin: 0 auto;
  display: flex;
  padding: 9px;
  border-radius: 44px;
  background: linear-gradient(155deg, #252a33, #0c0f14 55%, #101318);
  box-shadow:
    0 30px 60px -32px rgba(15, 23, 42, .55),
    0 0 0 1px rgba(15, 23, 42, .06),
    inset 0 0 0 1px rgba(255, 255, 255, .06);
  transition: box-shadow .18s, background .18s;
}
.phone-body {
  flex: 1;
  min-height: 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  border-radius: 36px;
  overflow: hidden;
  background: var(--chat-bg, #f2f4f7);
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .04);
}
.stage-foot {
  flex: none;
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px;
  padding: 7px 4px 0;
  font-size: 10.5px;
  color: var(--faint);
}
.stage-foot .hint { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.foot-meta { display: inline-flex; align-items: center; gap: 10px; flex: none; font-variant-numeric: tabular-nums; }
.save-status { display: inline-flex; align-items: center; gap: 5px; }
.save-status::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: #9aa3af; flex: none; }
.save-status.ok::before { background: #2bb673; }
.save-status.error { color: var(--danger); }
.save-status.error::before { background: var(--danger); }

/* phone theme tokens ------------------------------------------------- */
.phone[data-platform="qq"][data-mode="light"] {
  --chat-bg: #f2f4f7;
  --hdr-bg: #ffffff;
  --hdr-text: #12151a;
  --hdr-sub: #8b919b;
  --hdr-line: rgba(0, 0, 0, .065);
  --sb-text: #12151a;
  --cmp-bg: #ffffff;
  --cmp-line: #e8eaed;
  --cmp-input: #f2f4f7;
  --cmp-text: #12151a;
  --cmp-sub: #8b919b;
  --cmp-icon: #3d444e;
  --cmp-accent: #0099ff;
  --cmp-accent-text: #ffffff;
}
.phone[data-platform="qq"][data-mode="dark"] {
  --chat-bg: #0f1115;
  --hdr-bg: #171a1f;
  --hdr-text: #f1f3f5;
  --hdr-sub: #8b919b;
  --hdr-line: rgba(255, 255, 255, .07);
  --sb-text: #f1f3f5;
  --cmp-bg: #171a1f;
  --cmp-line: rgba(255, 255, 255, .07);
  --cmp-input: #23272e;
  --cmp-text: #e8eaed;
  --cmp-sub: #8b919b;
  --cmp-icon: #c4cad2;
  --cmp-accent: #0a84ff;
  --cmp-accent-text: #ffffff;
}
.phone[data-platform="wechat"][data-mode="light"] {
  --chat-bg: #ededed;
  --hdr-bg: #ededed;
  --hdr-text: #111111;
  --hdr-sub: #8c8c8c;
  --hdr-line: rgba(0, 0, 0, .08);
  --sb-text: #111111;
  --cmp-bg: #f7f7f7;
  --cmp-line: #dcdcdc;
  --cmp-input: #ffffff;
  --cmp-text: #111111;
  --cmp-sub: #8c8c8c;
  --cmp-icon: #3d3d3d;
  --cmp-accent: #95ec69;
  --cmp-accent-text: #111111;
}
.phone[data-platform="wechat"][data-mode="dark"] {
  --chat-bg: #111111;
  --hdr-bg: #1c1c1c;
  --hdr-text: #e6e6e6;
  --hdr-sub: #8c8c8c;
  --hdr-line: rgba(255, 255, 255, .07);
  --sb-text: #e6e6e6;
  --cmp-bg: #1c1c1c;
  --cmp-line: rgba(255, 255, 255, .08);
  --cmp-input: #2c2c2c;
  --cmp-text: #e6e6e6;
  --cmp-sub: #8c8c8c;
  --cmp-icon: #d0d0d0;
  --cmp-accent: #2f5d33;
  --cmp-accent-text: #eaf5e4;
}
.phone[data-mode="dark"] { background: linear-gradient(155deg, #1a1e25, #06080b 60%); }

/* chat header ------------------------------------------------------- */
.chat-header {
  flex: none;
  background: var(--hdr-bg);
  color: var(--hdr-text);
  border-bottom: 1px solid var(--hdr-line);
  position: relative;
  z-index: 2;
}
.statusbar {
  height: 42px;
  padding: 0 18px;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--sb-text);
}
.sb-time { font-size: 13px; font-weight: 650; letter-spacing: .01em; font-variant-numeric: tabular-nums; }
.sb-icons { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; color: var(--sb-text); }
.sb-ico { height: 11px; width: auto; fill: currentColor; display: block; }
.sb-ico[viewBox="0 0 16 12"] { height: 10px; }
.titlebar {
  height: 52px;
  display: grid;
  grid-template-columns: 48px minmax(0, 1fr) 48px;
  align-items: center;
}
.title-btn {
  width: 44px; height: 44px;
  margin: 0 auto;
  border: 0; border-radius: 50%;
  background: transparent;
  color: var(--hdr-text);
  display: grid; place-items: center;
  cursor: pointer;
}
.title-btn:hover { background: rgba(127, 127, 127, .12); }
.title-main { min-width: 0; text-align: center; cursor: pointer; }
.title-text {
  font-size: 17px; font-weight: 600; letter-spacing: -.01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.title-sub { margin-top: 1px; font-size: 10px; color: var(--hdr-sub); font-weight: 400; }
.phone[data-platform="wechat"] .title-sub { display: none; }

/* messages canvas ---------------------------------------------------- */
.phone-screen {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  background: var(--chat-bg);
  position: relative;
  overscroll-behavior: contain;
}
.canvas-wrap { position: relative; width: 100%; }
#preview-canvas { display: block; width: 100%; height: auto; }
.drop-line {
  position: absolute;
  left: 10px; right: 10px;
  height: 3px;
  border-radius: 3px;
  background: var(--accent);
  box-shadow: 0 0 0 3px rgba(11, 132, 255, .15);
  pointer-events: none;
  z-index: 3;
}
.drop-line::after {
  content: "";
  position: absolute; right: -7px; top: -4px;
  width: 11px; height: 11px;
  border-radius: 50%;
  background: #fff;
  border: 3px solid var(--accent);
}
body.is-dragging .phone-body { box-shadow: inset 0 0 0 2px rgba(11, 132, 255, .6); }
body.is-dragging .phone { box-shadow: 0 0 0 4px rgba(11, 132, 255, .14), 0 30px 60px -32px rgba(15, 23, 42, .55); }

/* composer ---------------------------------------------------------- */
.composer {
  position: relative;
  flex: none;
  display: flex;
  align-items: flex-end;
  gap: 6px;
  padding: 8px 10px;
  background: var(--cmp-bg);
  border-top: 1px solid var(--cmp-line);
  color: var(--cmp-text);
  z-index: 4;
}
.role-btn {
  flex: none;
  height: 38px;
  padding: 2px;
  display: inline-flex;
  align-items: center;
  gap: 1px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  cursor: pointer;
}
.role-btn:hover { background: rgba(127, 127, 127, .12); }
.role-avatar {
  width: 32px; height: 32px;
  display: grid; place-items: center;
  border-radius: 50%;
  overflow: hidden;
  background: #dfe6f0;
  font-size: 18px;
  line-height: 1;
}
.role-avatar img { width: 100%; height: 100%; object-fit: cover; }
.phone[data-platform="wechat"] .role-avatar { border-radius: 5px; }
.role-caret { width: 8px; height: 5px; color: var(--cmp-sub); flex: none; }
.composer-input-wrap {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  padding: 0 10px;
  border-radius: 18px;
  background: var(--cmp-input);
}
.phone[data-platform="wechat"] .composer-input-wrap { border-radius: 6px; }
#composer-input {
  width: 100%;
  min-height: 34px;
  max-height: 86px;
  padding: 7px 0;
  border: 0;
  outline: none;
  background: transparent;
  color: var(--cmp-text);
  font-size: 14px;
  line-height: 1.5;
  resize: none;
  overflow-y: auto;
}
#composer-input::placeholder { color: var(--cmp-sub); opacity: .85; }
.composer-detail {
  flex: none;
  width: 30px; height: 34px;
  display: grid; place-items: center;
  border: 0; border-radius: 8px;
  background: transparent;
  color: var(--cmp-icon);
  cursor: pointer;
}
.composer-detail:hover { background: rgba(127, 127, 127, .12); }
.composer-send {
  flex: none;
  height: 32px;
  padding: 0 13px;
  border: 0;
  border-radius: 8px;
  background: var(--cmp-accent);
  color: var(--cmp-accent-text);
  font-size: 12.5px;
  font-weight: 650;
  cursor: pointer;
  margin-bottom: 2px;
}
.phone[data-platform="wechat"] .composer-send { border-radius: 5px; }
.composer-send:disabled { opacity: .45; cursor: default; }

.role-pop {
  position: absolute;
  left: 10px;
  bottom: calc(100% + 6px);
  width: 258px;
  max-width: calc(100% - 20px);
  max-height: 290px;
  overflow: auto;
  padding: 6px;
  border: 1px solid #e5e9ef;
  border-radius: 12px;
  background: #fff;
  color: #14171c;
  box-shadow: 0 18px 44px -16px rgba(15, 23, 42, .38);
  z-index: 10;
}
.role-pop-row {
  width: 100%;
  display: flex; align-items: center; gap: 8px;
  padding: 6px;
  border: 0; border-radius: 8px;
  background: transparent;
  text-align: left;
  cursor: pointer;
}
.role-pop-row:hover { background: #f5f8fc; }
.role-pop-row.active { background: #eef6ff; }
.role-pop-avatar {
  width: 28px; height: 28px; flex: none;
  display: grid; place-items: center;
  border-radius: 50%;
  overflow: hidden;
  font-size: 16px;
  background: #eef2f8;
}
.role-pop-avatar img { width: 100%; height: 100%; object-fit: cover; }
.role-pop-name { font-size: 12px; font-weight: 650; }
.role-pop-id { font-size: 9.5px; color: #98a0ac; margin-top: 1px; }
.role-pop-check { margin-left: auto; color: #0b84ff; font-size: 12px; }

/* ------------------------------------------------------------------ */
/* pool panel                                                          */
/* ------------------------------------------------------------------ */
.pool-panel {
  height: 100%;
  min-height: 0;
  display: flex;
  flex-direction: column;
  padding: 14px 12px 10px;
}
.panel-head { flex: none; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.panel-actions { display: flex; align-items: center; gap: 3px; }
.panel-title { margin-top: 2px; font-size: 12px; font-weight: 650; color: var(--ink-2); }
.eyebrow {
  font-size: 9.5px; font-weight: 750;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: #8b93a1;
}
.pool-grid {
  flex: 1;
  min-height: 0;
  margin-top: 12px;
  padding: 1px;
  display: flex;
  flex-direction: column;
  gap: 7px;
  overflow: auto;
  align-content: start;
}
.pool-card {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  padding: 7px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fff;
  cursor: grab;
  user-select: none;
  transition: border-color .14s, background .14s, transform .1s;
}
.pool-card:hover { border-color: #bcd8ff; background: #f8fbff; }
.pool-card:active { cursor: grabbing; transform: scale(.99); }
.pool-card.active { border-color: #9fc9ff; background: #f1f8ff; box-shadow: inset 0 0 0 1px rgba(11,132,255,.12); }
.pool-panel.flash { box-shadow: 0 0 0 3px rgba(11, 132, 255, .2), 0 1px 2px rgba(16, 24, 40, .04); }
.pool-avatar {
  width: 34px; height: 34px; flex: none;
  display: grid; place-items: center;
  border-radius: 50%;
  background: #eef2f8;
  font-size: 18px;
  overflow: hidden;
}
.pool-avatar img { width: 100%; height: 100%; object-fit: cover; }
.pool-meta { min-width: 0; flex: 1; }
.pool-name {
  font-size: 12.5px; font-weight: 650;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.pool-id { margin-top: 1px; font-size: 9.5px; color: var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pool-tag {
  display: inline-block;
  margin-left: 3px; padding: 0 4px;
  border-radius: 4px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 8.5px; font-weight: 700;
  vertical-align: 1px;
}
.pool-edit {
  flex: none;
  width: 24px; height: 24px;
  display: grid; place-items: center;
  border: 0; border-radius: 6px;
  background: transparent;
  color: #9aa3af;
  cursor: pointer;
}
.pool-edit:hover { background: #eef2f8; color: var(--ink); }
.panel-foot { flex: none; padding-top: 8px; font-size: 9.5px; color: var(--faint); line-height: 1.5; }

/* ------------------------------------------------------------------ */
/* detail panel                                                        */
/* ------------------------------------------------------------------ */
.detail-panel {
  height: 100%;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.sheet-bar {
  flex: none;
  height: 50px;
  padding: 0 8px;
  display: flex;
  align-items: center;
  gap: 6px;
  border-bottom: 1px solid var(--line-2);
  background: #fff;
  z-index: 2;
}
.sheet-title { font-size: 13px; font-weight: 650; }
.sheet-spacer { flex: 1; }
.detail-head {
  flex: none;
  min-height: 60px;
  padding: 10px 13px;
  display: flex;
  align-items: center;
  gap: 9px;
  border-bottom: 1px solid var(--line-2);
}
.dh-avatar {
  width: 34px; height: 34px; flex: none;
  display: grid; place-items: center;
  border-radius: 50%;
  overflow: hidden;
  background: #eef2f8;
  font-size: 18px;
}
.dh-avatar img { width: 100%; height: 100%; object-fit: cover; }
.dh-main { flex: 1; min-width: 0; }
.dh-title { font-size: 12.5px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dh-sub { margin-top: 2px; font-size: 10px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dh-actions { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; justify-content: flex-end; }
.detail-scroll { flex: 1; min-height: 0; overflow: auto; padding: 13px; }

/* ------------------------------------------------------------------ */
/* forms                                                               */
/* ------------------------------------------------------------------ */
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > span { font-size: 10.5px; font-weight: 650; color: var(--muted); }
.input, .select, textarea.input {
  width: 100%;
  min-width: 0;
  height: 32px;
  padding: 0 9px;
  border: 1px solid #dfe3e9;
  border-radius: 8px;
  background: #fff;
  font-size: 12px;
  color: var(--ink);
  transition: border-color .14s, box-shadow .14s;
}
textarea.input { height: auto; min-height: 64px; padding: 8px 9px; line-height: 1.65; resize: vertical; }
.input:hover, .select:hover, textarea.input:hover { border-color: #cbd3de; }
.input:focus, .select:focus, textarea.input:focus {
  outline: none;
  border-color: #8fc2ff;
  box-shadow: 0 0 0 3px rgba(11, 132, 255, .12);
}
.select { padding-right: 4px; }
.input[readonly] { background: #f7f8fa; color: var(--muted); }

.inline-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.inline-fields .span-2 { grid-column: 1 / -1; }
.meta-grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: 9px; margin-bottom: 10px; }
.meta-note { font-size: 10px; line-height: 1.65; color: var(--faint); }
.section-label {
  display: flex; align-items: center; gap: 9px;
  margin: 2px 0 9px;
  font-size: 9.5px; font-weight: 750; letter-spacing: .12em;
  text-transform: uppercase;
  color: #8b93a1;
}
.section-label::after { content: ""; height: 1px; flex: 1; background: var(--line-2); }
.section-label .count { order: 2; font-size: 9px; letter-spacing: 0; color: var(--faint); }

/* segments ---------------------------------------------------------- */
.seg {
  margin-bottom: 8px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
}
.seg-head {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 8px;
  background: #fafbfd;
  border-bottom: 1px solid var(--line-2);
}
.seg-type {
  padding: 2px 6px;
  border-radius: 5px;
  background: #edf5ff;
  color: #2468b8;
  font-size: 9.5px; font-weight: 750;
  white-space: nowrap;
}
.seg-type.ext { background: #fff3dd; color: #8a5a00; }
.seg-spec { font-size: 9px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg-tools { margin-left: auto; display: flex; gap: 1px; flex: none; }
.seg-body { padding: 9px; }
.seg-body .inline-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg-body .inline-fields .span-2 { grid-column: 1 / -1; }
.seg-note { margin-top: 7px; font-size: 9.5px; line-height: 1.6; color: var(--faint); }
.seg-note code { font: 9.5px Consolas, monospace; background: #f4f6f9; padding: 1px 3px; border-radius: 3px; }

.seg-add {
  display: flex; align-items: center; flex-wrap: wrap; gap: 4px;
  margin-top: 9px; padding-top: 9px;
  border-top: 1px dashed var(--line);
}
.seg-add-label { margin-right: 1px; font-size: 9.5px; font-weight: 750; letter-spacing: .08em; color: #8b93a1; }
.chip-btn {
  height: 24px; padding: 0 7px;
  display: inline-flex; align-items: center; gap: 3px;
  border: 1px solid #e2e7ee;
  border-radius: 6px;
  background: #fff;
  color: var(--ink-2);
  font-size: 10px; font-weight: 650;
  cursor: pointer;
}
.chip-btn:hover { border-color: #b9d6ff; background: #f6faff; color: #0b6bd8; }
.chip-btn.add { color: #2468b8; background: #f5faff; border-color: #d8e8ff; }
.seg-add .select { width: auto; height: 24px; font-size: 10px; border-radius: 6px; margin-left: auto; }

.media-edit { display: flex; gap: 10px; align-items: flex-start; }
.media-thumb {
  width: 72px; height: 72px; flex: none;
  display: grid; place-items: center;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #f6f7f9;
  overflow: hidden;
  color: var(--faint);
  font-size: 9.5px;
}
.media-thumb img { width: 100%; height: 100%; object-fit: cover; }
.media-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.media-actions { display: flex; gap: 4px; flex-wrap: wrap; }
.file-name { font-size: 11px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mono { font: 9.5px/1.6 Consolas, "Cascadia Mono", monospace; color: var(--faint); word-break: break-all; }
.face-preview { display: inline-flex; align-items: center; gap: 7px; }
.face-preview .emoji { font-size: 22px; line-height: 1; }

.json-block { margin-top: 11px; border: 1px solid var(--line); border-radius: 8px; background: #fbfcfd; overflow: hidden; }
.json-block summary { padding: 7px 9px; font-size: 10px; font-weight: 650; color: var(--muted); cursor: pointer; list-style: none; }
.json-block summary::-webkit-details-marker { display: none; }
.json-block summary::before { content: "{ }  "; color: #98a0ac; font-family: Consolas, monospace; }
.json-block pre {
  margin: 0; padding: 9px;
  max-height: 200px; overflow: auto;
  background: #0f172a; color: #d7e2f3;
  font: 10px/1.6 Consolas, "Cascadia Mono", monospace;
}

/* empty / flow ------------------------------------------------------ */
.detail-empty { padding: 1px; }
.empty-hero {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 11px;
  margin-bottom: 12px;
  border: 1px dashed #cfd9e7;
  border-radius: 11px;
  background: linear-gradient(180deg, #fafcff, #f5f9ff);
}
.empty-icon {
  width: 36px; height: 36px; flex: none;
  display: grid; place-items: center;
  border-radius: 10px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 16px;
}
.empty-hero h3 { margin: 1px 0 3px; font-size: 12.5px; }
.empty-hero p { margin: 0; font-size: 10.5px; line-height: 1.7; color: var(--muted); }
.quick-actions { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 12px; }
.flow { border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.flow-row {
  display: grid;
  grid-template-columns: 40px minmax(0, 1fr) auto;
  gap: 7px; align-items: center;
  padding: 7px 8px;
  background: #fff;
  border-top: 1px solid var(--line-2);
  cursor: pointer;
}
.flow-row:first-child { border-top: 0; }
.flow-row:hover { background: #f8fbff; }
.flow-row.active { background: #eef6ff; }
.flow-time { font-size: 9px; color: var(--faint); font-variant-numeric: tabular-nums; }
.flow-main { min-width: 0; font-size: 10.5px; }
.flow-who { font-weight: 650; color: var(--ink-2); }
.flow-text { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.flow-kind { font-size: 8.5px; color: #8b93a1; background: #f1f4f8; padding: 1px 5px; border-radius: 4px; white-space: nowrap; }

/* ------------------------------------------------------------------ */
/* context menu (right click / long press)                             */
/* ------------------------------------------------------------------ */
.ctx-backdrop {
  position: fixed;
  inset: 0;
  z-index: 109;
  background: rgba(15, 23, 42, .28);
  backdrop-filter: blur(2px);
}
.ctx-backdrop[hidden] { display: none; }
.ctx-menu {
  position: fixed;
  z-index: 110;
  width: 226px;
  max-height: calc(100vh - 16px);
  overflow: auto;
  padding: 6px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--panel);
  color: var(--ink);
  box-shadow: 0 18px 50px -18px rgba(15, 23, 42, .55), 0 2px 6px rgba(15, 23, 42, .08);
}
.ctx-menu[hidden] { display: none; }
.ctx-head {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 9px 9px;
  margin-bottom: 4px;
  border-bottom: 1px solid var(--line-2);
}
.ctx-avatar {
  flex: none;
  width: 30px;
  height: 30px;
  border-radius: 9px;
  display: grid;
  place-items: center;
  overflow: hidden;
  font-size: 17px;
}
.ctx-avatar img { width: 100%; height: 100%; object-fit: cover; }
.ctx-avatar.notice { background: var(--line-2); color: var(--faint); font-size: 16px; }
.ctx-head-main { min-width: 0; flex: 1; }
.ctx-title {
  font-size: 11.5px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ctx-sub {
  margin-top: 1px;
  font-size: 9.5px;
  color: var(--faint);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ctx-item {
  display: flex;
  align-items: center;
  gap: 9px;
  width: 100%;
  padding: 8px 9px;
  border: 0;
  border-radius: 8px;
  background: none;
  color: var(--ink-2);
  font: inherit;
  font-size: 11.5px;
  text-align: left;
  cursor: pointer;
}
.ctx-item:hover,
.ctx-item:focus-visible { background: var(--line-2); outline: none; }
.ctx-item.danger { color: var(--danger); }
.ctx-item.danger:hover,
.ctx-item.danger:focus-visible { background: rgba(214, 69, 69, .08); }
.ctx-item:disabled { opacity: .36; cursor: not-allowed; background: none; }
.ctx-ico {
  flex: none;
  width: 16px;
  text-align: center;
  font-size: 13px;
  color: var(--faint);
}
.ctx-item.danger .ctx-ico { color: var(--danger); }
.ctx-label { flex: 1; min-width: 0; }
.ctx-sep { height: 1px; margin: 4px 6px; background: var(--line-2); }

@media (max-width: 760px) {
  .ctx-menu {
    left: 10px !important;
    right: 10px;
    top: auto !important;
    bottom: calc(10px + env(safe-area-inset-bottom));
    width: auto;
    max-height: 70vh;
    padding: 8px;
    border-radius: 16px;
    box-shadow: 0 -20px 60px -20px rgba(15, 23, 42, .45);
  }
  .ctx-head { padding: 10px 10px 11px; }
  .ctx-sub { font-size: 10px; }
  .ctx-item { padding: 12px 10px; border-radius: 10px; font-size: 13px; }
  .ctx-ico { width: 20px; font-size: 15px; }
}

/* ------------------------------------------------------------------ */
/* drawer                                                              */
/* ------------------------------------------------------------------ */
.drawer {
  position: fixed;
  left: 0; top: 0; bottom: 0;
  width: 400px;
  max-width: 92vw;
  display: flex;
  flex-direction: column;
  background: #fff;
  z-index: 90;
  transform: translateX(-102%);
  transition: transform .24s cubic-bezier(.2, .8, .2, 1);
  box-shadow: 24px 0 60px -30px rgba(15, 23, 42, .45);
  border-radius: 0 16px 16px 0;
}
body.drawer-open .drawer { transform: none; }
.drawer-backdrop {
  position: fixed; inset: 0;
  z-index: 80;
  background: rgba(15, 23, 42, .4);
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s;
}
body.drawer-open .drawer-backdrop { opacity: 1; pointer-events: auto; }
.drawer-head {
  flex: none;
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px;
  padding: 16px;
  border-bottom: 1px solid var(--line-2);
}
.drawer-title { font-size: 15px; font-weight: 700; }
.drawer-sub { margin-top: 2px; font-size: 10px; color: var(--faint); }
.drawer-scroll { flex: 1; min-height: 0; overflow: auto; padding: 14px 16px 24px; }
.drawer-section { margin-bottom: 20px; }
.drawer-section:last-child { margin-bottom: 0; }
.drawer-section-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px;
  margin-bottom: 9px;
}
.drawer-section-title { font-size: 10px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; color: #8b93a1; }
.drawer-note { margin-top: 7px; font-size: 9.5px; line-height: 1.65; color: var(--faint); }
.drawer .field + .field { margin-top: 9px; }
.drawer .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 9px; }

.setting-row {
  display: flex; align-items: center; justify-content: space-between;
  gap: 14px;
  padding: 9px 0;
  border-bottom: 1px solid var(--line-2);
}
.setting-row:last-of-type { border-bottom: 0; }
.setting-text { min-width: 0; }
.setting-name { font-size: 11.5px; font-weight: 650; }
.setting-desc { margin-top: 2px; font-size: 9.5px; line-height: 1.55; color: var(--faint); }
.setting-control { flex: none; display: flex; align-items: center; gap: 7px; }
.setting-control .select, .setting-control .input { width: 142px; height: 30px; font-size: 11px; }
.switch { position: relative; display: inline-flex; width: 38px; height: 22px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch span { width: 38px; height: 22px; border-radius: 999px; background: #dfe4eb; transition: .18s; pointer-events: none; }
.switch span::after {
  content: ""; position: absolute; left: 3px; top: 3px;
  width: 16px; height: 16px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.22);
  transition: .18s;
}
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(16px); }
input[type="range"] { width: 120px; accent-color: var(--accent); }
input[type="color"] { width: 34px; height: 30px; padding: 2px; border: 1px solid var(--line); border-radius: 7px; background: #fff; cursor: pointer; }
.output-value { min-width: 36px; text-align: right; font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

.progress { height: 6px; border-radius: 999px; background: #edf0f4; overflow: hidden; }
.progress > span { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, #2a9bff, #006fe0); transition: width .25s; }
.progress.warn > span { background: linear-gradient(90deg, #f2a33c, #e07b12); }
.progress.danger > span { background: linear-gradient(90deg, #e86a6a, #cf3c3c); }

.stat-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin: 9px 0 7px; }
.stat { padding: 8px; border: 1px solid var(--line); border-radius: 9px; background: #fbfcfd; }
.stat-value { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat-label { margin-top: 1px; font-size: 9px; color: var(--faint); }
.data-actions { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
.data-note { margin-top: 8px; font-size: 9.5px; line-height: 1.65; color: var(--faint); }

.issue-list { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
.issue {
  display: flex; gap: 6px; align-items: flex-start;
  padding: 6px 7px;
  border-radius: 6px;
  font-size: 10px; line-height: 1.55;
  background: #f7f9fc;
  color: var(--ink-2);
}
.issue::before { content: "!"; flex: none; width: 13px; height: 13px; border-radius: 50%; display: grid; place-items: center; font-size: 8.5px; font-weight: 800; background: #ffe9c7; color: #9a6200; }
.issue.error { background: #fdf3f3; }
.issue.error::before { content: "×"; background: #f8d7d7; color: #9c2b2b; }

/* ------------------------------------------------------------------ */
/* sheet overlays (pool / detail on narrow)                            */
/* ------------------------------------------------------------------ */
.sheet-backdrop {
  position: fixed; inset: 0;
  z-index: 60;
  background: rgba(15, 23, 42, .45);
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s;
}

/* ------------------------------------------------------------------ */
/* modal                                                               */
/* ------------------------------------------------------------------ */
.modal { border: 0; padding: 0; width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 40px); background: transparent; }
.modal.wide { width: min(740px, calc(100vw - 32px)); }
.modal::backdrop { background: rgba(15, 23, 42, .44); backdrop-filter: blur(3px); }
.modal-card {
  background: #fff;
  border-radius: 18px;
  box-shadow: 0 30px 80px -20px rgba(15, 23, 42, .44);
  padding: 20px;
  max-height: calc(100vh - 40px);
  overflow: auto;
}
.modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 15px; }
.modal-title { font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
.modal-sub { margin-top: 3px; font-size: 11px; line-height: 1.6; color: var(--muted); }
.modal-actions {
  display: flex; justify-content: flex-end; align-items: center; gap: 8px;
  margin-top: 16px; padding-top: 13px;
  border-top: 1px solid var(--line-2);
}
.modal-actions .spacer { flex: 1; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
.form-grid .span-2 { grid-column: 1 / -1; }

/* character modal ---------------------------------------------------- */
.char-top { display: flex; gap: 13px; align-items: center; margin-bottom: 15px; }
.char-big {
  width: 66px; height: 66px; flex: none;
  display: grid; place-items: center;
  border-radius: 50%;
  overflow: hidden;
  background: #eef2f8;
  font-size: 31px;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.05);
}
.char-big img { width: 100%; height: 100%; object-fit: cover; }
.char-top-meta { min-width: 0; flex: 1; }
.char-top-name { font-size: 15px; font-weight: 700; }
.char-top-id { margin-top: 2px; font-size: 10px; color: var(--faint); font-variant-numeric: tabular-nums; }
.emoji-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; max-height: 126px; overflow: auto; padding: 2px; }
.emoji-cell { height: 29px; border: 1px solid transparent; border-radius: 6px; background: transparent; font-size: 17px; cursor: pointer; }
.emoji-cell:hover { background: #f2f6fc; }
.emoji-cell.active { border-color: #9fc9ff; background: #eef6ff; }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; }
.swatch { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px #dfe3e9; cursor: pointer; }
.swatch.active { box-shadow: 0 0 0 2px var(--accent); }

/* export ------------------------------------------------------------- */
.export-form { display: flex; flex-direction: column; gap: 4px; }
.export-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 7px 0; }
.export-preview { margin-top: 13px; border: 1px solid var(--line); border-radius: 10px; background: #f7f9fc; padding: 9px; max-height: 300px; overflow: auto; }
.export-preview img { display: block; width: 100%; height: auto; border-radius: 7px; }
.export-meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 9px; font-size: 10px; color: var(--faint); }
.export-actions { display: flex; gap: 5px; flex-wrap: wrap; }

/* toast -------------------------------------------------------------- */
.toast {
  position: fixed;
  left: 50%;
  bottom: 26px;
  transform: translateX(-50%);
  z-index: 120;
  max-width: min(520px, calc(100vw - 40px));
  padding: 9px 14px;
  border-radius: 9px;
  background: #15181d;
  color: #fff;
  font-size: 12px;
  line-height: 1.5;
  box-shadow: 0 12px 30px rgba(0, 0, 0, .25);
  animation: toast-in .18s ease-out;
}
.toast.error { background: #b83232; }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 6px); } to { opacity: 1; transform: translate(-50%, 0); } }

/* ------------------------------------------------------------------ */
/* responsive                                                          */
/* ------------------------------------------------------------------ */
@media (max-width: 1420px) {
  .workspace { grid-template-columns: minmax(340px, 1fr) 224px minmax(380px, 460px); }
}
@media (max-width: 1180px) {
  .workspace { grid-template-columns: 1fr; padding: 12px; gap: 12px; height: calc(100vh - 64px); height: calc(100dvh - 64px); }
  .stage { height: 100%; }
  .only-narrow { display: inline-flex !important; }
  .pool-panel {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 70;
    height: min(620px, 78dvh);
    border-radius: 20px 20px 0 0;
    background: #fff;
    transform: translateY(103%);
    transition: transform .24s cubic-bezier(.2, .8, .2, 1);
    box-shadow: 0 -20px 60px -20px rgba(15, 23, 42, .4);
    padding-bottom: max(12px, env(safe-area-inset-bottom));
  }
  body.pool-open .pool-panel { transform: none; }
  .detail-panel {
    position: fixed;
    inset: 0;
    z-index: 75;
    border-radius: 0;
    background: #fff;
    transform: translateY(103%);
    transition: transform .24s cubic-bezier(.2, .8, .2, 1);
    padding-top: env(safe-area-inset-top);
  }
  body.detail-open .detail-panel { transform: none; }
  body.pool-open .sheet-backdrop, body.detail-open .sheet-backdrop { opacity: 1; pointer-events: auto; }
  .pool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-content: start; }
  .panel-foot { display: none; }
  .stage-foot { padding-bottom: env(safe-area-inset-bottom); }
  .drawer { width: 380px; }
}
@media (max-width: 760px) {
  .topbar { display: none; }
  body { height: 100dvh; }
  .workspace { display: block; padding: 0; height: 100dvh; }
  .stage {
    height: 100dvh;
    padding: 0;
    border: 0;
    border-radius: 0;
    box-shadow: none;
    background: transparent;
  }
  .stage-foot { display: none; }
  .phone {
    max-width: none;
    height: 100%;
    padding: 0;
    border-radius: 0;
    background: var(--chat-bg);
    box-shadow: none;
  }
  .phone-body { border-radius: 0; box-shadow: none; }
  .chat-header { padding-top: env(safe-area-inset-top); }
  .composer { padding-bottom: max(8px, env(safe-area-inset-bottom)); }
  .drawer { width: 90vw; border-radius: 0 14px 14px 0; }
  .detail-panel { padding-top: calc(env(safe-area-inset-top) + 0px); }
  .sheet-bar { height: 54px; }
  .meta-grid { grid-template-columns: 1fr; }
  .inline-fields { grid-template-columns: 1fr; }
  .inline-fields .span-2 { grid-column: auto; }
  .form-grid { grid-template-columns: 1fr; }
  .form-grid .span-2 { grid-column: auto; }
  .stat-grid { grid-template-columns: 1fr 1fr; }
  .pool-grid { grid-template-columns: 1fr; }
  .role-pop { width: calc(100% - 20px); }
  .modal { width: calc(100vw - 20px); }
  .modal-card { padding: 16px; }
  .emoji-grid { grid-template-columns: repeat(8, 1fr); }
}

/* ------------------------------------------------------------------ */
/* page chrome / drawer navigation                                     */
/* ------------------------------------------------------------------ */
a.brand { text-decoration: none; color: inherit; }
a.brand:hover .brand-name { color: var(--accent); }
.drawer-nav .nav-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 8px; }
.nav-link {
  display: flex; flex-direction: column; gap: 2px;
  padding: 8px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  color: var(--ink);
  text-decoration: none;
}

<script>
/* i18n.js — tiny dependency-free bilingual (zh / en) runtime.
 *
 * Usage in JS:
 *   CM.i18n.tr('中文', 'English', { n: 3 })
 *   CM.i18n.set('en')
 *   CM.i18n.onChange(function (lang) { ... })
 *
 * Static HTML uses paired attributes, only on leaf text nodes / attributes:
 *   <span data-zh="导出图片" data-en="Export image">导出图片</span>
 *   <button data-zh-title="撤销" data-en-title="Undo" ...>
 *   <input data-zh-placeholder="输入消息…" data-en-placeholder="Type a message…">
 *   <svg data-zh-aria="聊天记录预览" data-en-aria="Chat preview">
 *
 * Language lookup order: localStorage (mock_chatui:lang, falling back to the
 * legacy chatlog-mock:lang) > navigator.language (zh* -> zh, everything else
 * -> en). An English browser starts in English.
 */
(function () {
  'use strict';

  const CM = (window.CM = window.CM || {});
  const KEY = 'mock_chatui:lang';
  const LEGACY_KEY = 'chatlog-mock:lang';
  const LANGS = ['zh', 'en'];
  const listeners = [];

  function normalize(value) {
    return LANGS.indexOf(value) >= 0 ? value : '';
  }

  function stored() {
    try {
      const current = normalize(localStorage.getItem(KEY));
      if (current) return current;
      const legacy = normalize(localStorage.getItem(LEGACY_KEY));
      if (legacy) {
        try {
          localStorage.setItem(KEY, legacy);
        } catch (e) {}
        return legacy;
      }
      return '';
    } catch (e) {
      return '';
    }
  }

  function detect() {
    const saved = stored();
    if (saved) return saved;
    let nav = '';
    try {
      nav = String(navigator.language || navigator.userLanguage || '').toLowerCase();
    } catch (e) {}
    if (nav.indexOf('zh') === 0) return 'zh';
    if (nav) return 'en';
    return 'zh';
  }

  let lang = detect();

  function tr(zh, en, vars) {
    let text = lang === 'en' ? (en == null ? zh : en) : zh == null ? en : zh;
    if (text == null) text = '';
    if (vars) {
      text = String(text).replace(/\{(\w+)\}/g, function (match, key) {
        return Object.prototype.hasOwnProperty.call(vars, key) ? String(vars[key]) : match;
      });
    }
    return String(text);
  }

  /** Apply data-zh / data-en pairs to static markup. Safe to call repeatedly. */
  function apply(root) {
    const scope = root || document;
    if (!scope || !scope.querySelectorAll) return;

    // Leaf text only: containers that own child elements are left alone, so
    // icons / nested markup inside a translated label are never destroyed.
    scope.querySelectorAll('[data-zh]').forEach(function (el) {
      if (el.childElementCount > 0) return;
      const value = el.getAttribute('data-' + lang);
      if (value != null) el.textContent = value;
    });

    // Paired attributes: data-zh-title, data-zh-aria, data-zh-placeholder, ...
    scope.querySelectorAll('*').forEach(function (el) {
      const attrs = el.attributes;
      if (!attrs || !attrs.length) return;
      for (let i = 0; i < attrs.length; i++) {
        const name = attrs[i].name;
        if (name.indexOf('data-zh-') !== 0) continue;
        const suffix = name.slice('data-zh-'.length);
        const target = suffix === 'aria' ? 'aria-label' : suffix;
        const value = el.getAttribute('data-' + lang + '-' + suffix);
        if (value != null) el.setAttribute(target, value);
      }
    });

    // Highlight the active language button everywhere (shell + settings drawer).
    const buttons = document.querySelectorAll('[data-lang]');
    for (let i = 0; i < buttons.length; i++) {
      buttons[i].classList.toggle('active', buttons[i].getAttribute('data-lang') === lang);
    }

    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  }

  function applyActive() {
    const buttons = document.querySelectorAll('[data-lang]');
    for (let i = 0; i < buttons.length; i++) {
      buttons[i].classList.toggle('active', buttons[i].getAttribute('data-lang') === lang);
    }
  }

  function persist(next) {
    try {
      localStorage.setItem(KEY, next);
    } catch (e) {}
  }

  function set(next) {
    next = normalize(next);
    if (!next) return lang;
    if (next === lang) {
      applyActive();
      return lang;
    }
    lang = next;
    persist(lang);
    apply();
    listeners.slice().forEach(function (fn) {
      try {
        fn(lang);
      } catch (e) {
        if (window.console && console.error) console.error('[i18n] listener failed', e);
      }
    });
    // Listeners may have re-rendered dynamic UI (e.g. the settings drawer):
    // refresh active states for the new buttons without re-applying static
    // text over values those listeners just rendered.
    applyActive();
    return lang;
  }

  function onChange(fn) {
    if (typeof fn !== 'function') return function () {};
    listeners.push(fn);
    return function () {
      const i = listeners.indexOf(fn);
      if (i >= 0) listeners.splice(i, 1);
    };
  }

  CM.i18n = {
    KEY: KEY,
    get lang() {
      return lang;
    },
    get locale() {
      return lang === 'zh' ? 'zh-CN' : 'en';
    },
    isZh: function () {
      return lang === 'zh';
    },
    get: function () {
      return lang;
    },
    set: set,
    tr: tr,
    apply: apply,
    onChange: onChange
  };

  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';

  if (document.readyState === 'loading') {
    // Scripts sit at the end of <body>, so the static markup above is already
    // available: apply right away to avoid a flash of the other language.
    if (document.body) apply();
    document.addEventListener('DOMContentLoaded', function () {
      apply();
    });
  } else {
    apply();
  }
})();

</script>

<script>
/* core.js — data model, OneBot 12 helpers, themes, local storage */
(function () {
  'use strict';
  const CM = (window.CM = window.CM || {});

  CM.VERSION = '1.0.0';
  CM.FORMAT = 'mock_chatui/onebot12';
  CM.STORAGE_KEY = 'mock_chatui:dataset:v1';
  CM.UI_KEY = 'mock_chatui:ui:v1';
  // Read-only fallbacks from the old project name; migrated once on load.
  CM.LEGACY_STORAGE_KEY = 'chatlog-mock:dataset:v1';
  CM.LEGACY_UI_KEY = 'chatlog-mock:ui:v1';
  CM.DESIGN_WIDTH = 390;
  CM.FONT =
    '"Microsoft YaHei", "PingFang SC", "Noto Sans SC", "Segoe UI", system-ui, ' +
    '"Apple Color Emoji", "Segoe UI Emoji", sans-serif';

  /* i18n helper: inline zh/en pairs, evaluated on every call so a live
     language switch is reflected by the next render. */
  const tr = (zh, en, vars) => (CM.i18n ? CM.i18n.tr(zh, en, vars) : zh);

  /* ------------------------------------------------------------------ */
  /* small helpers                                                       */
  /* ------------------------------------------------------------------ */

  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  CM.esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ESC[c]);
  CM.uid = (prefix) =>
    (prefix || 'id') + '_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
  CM.nowSec = () => Math.floor(Date.now() / 1000);
  CM.clone = (v) => {
    if (typeof structuredClone === 'function') return structuredClone(v);
    return JSON.parse(JSON.stringify(v));
  };
  CM.pad = (n) => String(n).padStart(2, '0');

  CM.fmtClock = (ts) => {
    const d = new Date(ts * 1000);
    return CM.pad(d.getHours()) + ':' + CM.pad(d.getMinutes());
  };
  CM.fmtAbs = (ts) => {
    const d = new Date(ts * 1000);
    return (
      d.getFullYear() + '-' + CM.pad(d.getMonth() + 1) + '-' + CM.pad(d.getDate()) +
      ' ' + CM.pad(d.getHours()) + ':' + CM.pad(d.getMinutes())
    );
  };
  CM.fmtDivider = (ts) => {
    const d = new Date(ts * 1000);
    const now = new Date();
    const startOf = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
    const dayDiff = Math.round((startOf(now) - startOf(d)) / 86400000);
    const hm = CM.pad(d.getHours()) + ':' + CM.pad(d.getMinutes());
    if (dayDiff === 0) return hm;
    if (dayDiff === 1) return tr('昨天 {time}', 'Yesterday {time}', { time: hm });
    if (dayDiff === -1) return tr('明天 {time}', 'Tomorrow {time}', { time: hm });
    const sameYear = d.getFullYear() === now.getFullYear();
    const locale = CM.i18n && CM.i18n.lang === 'en' ? 'en-US' : 'zh-CN';
    try {
      return new Intl.DateTimeFormat(locale, {
        year: sameYear ? undefined : 'numeric',
        month: 'short',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false,
      }).format(d);
    } catch (e) {
      const date = sameYear
        ? d.getMonth() + 1 + '月' + d.getDate() + '日'
        : d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日';
      return date + ' ' + hm;
    }
  };
  CM.toLocalInput = (ts) => {
    const d = new Date(ts * 1000);
    return (
      d.getFullYear() + '-' + CM.pad(d.getMonth() + 1) + '-' + CM.pad(d.getDate()) +
      'T' + CM.pad(d.getHours()) + ':' + CM.pad(d.getMinutes())
    );
  };
  CM.fromLocalInput = (s) => {
    const t = new Date(s).getTime();
    return Number.isFinite(t) ? t / 1000 : null;
  };
  CM.fmtBytes = (n) => {
    if (!Number.isFinite(n) || n < 0) return '—';
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(n < 10240 ? 1 : 0) + ' KB';
    return (n / 1024 / 1024).toFixed(2) + ' MB';
  };
  CM.debounce = (fn, ms) => {
    let t = 0;
    return function () {
      const args = arguments;
      clearTimeout(t);
      t = setTimeout(() => fn.apply(null, args), ms);
    };
  };

  /* ------------------------------------------------------------------ */
  /* OneBot 12 vocabulary                                                */
  /* ------------------------------------------------------------------ */

  CM.SEGMENT_META = {
    text: { get label() { return CM.segLabel('text'); }, standard: true },
    mention: { get label() { return CM.segLabel('mention'); }, standard: true },
    mention_all: { get label() { return CM.segLabel('mention_all'); }, standard: true },
    image: { get label() { return CM.segLabel('image'); }, standard: true },
    voice: { get label() { return CM.segLabel('voice'); }, standard: true },
    audio: { get label() { return CM.segLabel('audio'); }, standard: true },
    video: { get label() { return CM.segLabel('video'); }, standard: true },
    file: { get label() { return CM.segLabel('file'); }, standard: true },
    location: { get label() { return CM.segLabel('location'); }, standard: true },
    reply: { get label() { return CM.segLabel('reply'); }, standard: true },
    'qq.face': {
      get label() { return CM.segLabel('qq.face'); },
      standard: false,
      get note() {
        return tr(
          '扩展消息段，命名符合 OneBot 扩展规则（<prefix>. 前缀）',
          'Extended segment named per the OneBot extension rule (<prefix>. prefix)'
        );
      },
    },
  };

  CM.NOTICE_META = {
    group_member_increase: {
      get label() { return CM.noticeLabel('group_member_increase'); },
      subTypes: ['join', 'invite'],
      groupOnly: true,
    },
    group_member_decrease: {
      get label() { return CM.noticeLabel('group_member_decrease'); },
      subTypes: ['leave', 'kick'],
      groupOnly: true,
    },
    group_message_delete: {
      get label() { return CM.noticeLabel('group_message_delete'); },
      subTypes: ['recall', 'delete'],
      groupOnly: true,
    },
  };

  /* Display labels live in functions: a static label captured at load time
     would go stale after a language switch. */
  CM.segLabel = function (type) {
    switch (type) {
      case 'text': return tr('文本', 'Text');
      case 'mention': return tr('提及 @', 'Mention @');
      case 'mention_all': return tr('@全体成员', '@all');
      case 'image': return tr('图片', 'Image');
      case 'voice': return tr('语音', 'Voice');
      case 'audio': return tr('音频', 'Audio');
      case 'video': return tr('视频', 'Video');
      case 'file': return tr('文件', 'File');
      case 'location': return tr('位置', 'Location');
      case 'reply': return tr('回复', 'Reply');
      case 'qq.face': return tr('QQ 表情', 'QQ face');
      default: return String(type);
    }
  };
  CM.noticeLabel = function (detailType) {
    switch (detailType) {
      case 'group_member_increase': return tr('成员加入', 'Member joined');
      case 'group_member_decrease': return tr('成员退出', 'Member left');
      case 'group_message_delete': return tr('消息撤回 / 删除', 'Message recall / delete');
      default: return String(detailType);
    }
  };

  CM.FACES = [
    { id: '0', name: '惊讶', emoji: '😮' },

  CM.theme = function (settings) {
    const platform = settings && settings.platform === 'wechat' ? 'wechat' : 'qq';
    const mode = settings && settings.mode === 'dark' ? 'dark' : 'light';
    const t = platform === 'wechat' ? (mode === 'dark' ? wxDark() : wxLight()) : (mode === 'dark' ? qqDark() : qqLight());
    t.platform = platform;
    t.mode = mode;
    return t;
  };

  CM.charMap = function (data) {
    const map = {};
    (data.characters || []).forEach((c) => (map[c.user_id] = c));
    return map;
  };
  CM.selfId = function (data) {
    return data && data.self ? String(data.self.user_id) : '';
  };
  CM.charOf = function (data, userId) {
    const id = String(userId);
    return (data.characters || []).find((c) => String(c.user_id) === id) || null;
  };
  CM.charName = function (data, userId) {
    const c = CM.charOf(data, userId);
    if (c) return c.name;
    if (String(userId) === CM.selfId(data)) return tr('我', 'Me');
    return tr('用户 {id}', 'User {id}', { id: userId });
  };

  CM.altMessage = function (segments, data) {
    const chars = CM.charMap(data);
    return (segments || [])
      .map((seg) => {
        const d = (seg && seg.data) || {};
        switch (seg && seg.type) {
          case 'text':
            return d.text || '';
          case 'mention':
            return '@' + ((chars[d.user_id] && chars[d.user_id].name) || d.user_id || '');
          case 'mention_all':
            return tr('@全体成员', '@all');
          case 'image':
            return tr('[图片]', '[Image]');
          case 'voice':
            return tr('[语音]', '[Voice]');
          case 'audio':
            return tr('[音频]', '[Audio]');
          case 'video':
            return tr('[视频]', '[Video]');
          case 'file':
            return tr('[文件]', '[File]');
          case 'location':
            return tr('[位置] ', '[Location] ') + (d.title || '');
          case 'reply':
            return '';
          case 'qq.face':
            return tr('[表情:{name}]', '[Face: {name}]', { name: CM.faceName(d.id) });
          default:
            return '[' + (seg && seg.type) + ']';
        }
      })
      .join('');
  };

      mime: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
      size: 25190,
    };

    // second session: private chat, yesterday evening
    const y = new Date();
    y.setDate(y.getDate() - 1);
    y.setHours(21, 40, 0, 0);
    const pbase = Math.floor(y.getTime() / 1000);
    let pseq = 2001;
    const pevents = [];
    function pmsg(userId, minute, segments) {
      const ev = {
        id: CM.uid('evt'),
        time: pbase + minute * 60,
        type: 'message',
        detail_type: 'private',
        sub_type: '',
        self: { ...self },
        message_id: String(pseq++),
        message: segments,
        alt_message: '',
        user_id: String(userId),
      };
      pevents.push(ev);
      return ev;
    }
    pmsg('10001', 0, [text('到家了吗')]);
    pmsg(selfId, 2, [text('刚到，外面有点冷')]);
    pmsg('10001', 3, [text('多穿点，明天降温')]);
    pmsg(selfId, 5, [text('知道啦，你也早点睡'), face('52')]);
    pmsg('10001', 7, [text('晚安 🌙')]);
    pmsg(selfId, 8, [text('晚安')]);

    const data = {
      format: CM.FORMAT,
      version: 1,
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString(),
      meta: { nextMessageId: 3001, source: 'demo' },
      self: { platform: 'qq', user_id: selfId },
      characters: chars,
      files,
      sessions: [
        {
          id: 'sess_demo_group',
          title: '摸鱼研究所',
          detail_type: 'group',
          group_id: groupId,
          user_id: '',
          member_count: 12,
          avatar: '🐟',
          events,
        },
        {
          id: 'sess_demo_private',
          title: '夏末',
          detail_type: 'private',
          group_id: '',
          user_id: '10001',
          member_count: 0,
          avatar: '',
          events: pevents,
        },
      ],
      settings: CM.defaultSettings(),
    };
    data.settings.exportWidth = 1080;
    CM.refreshDerived(data);
    return data;
  };

  /* ------------------------------------------------------------------ */
  /* derived data                                                        */
  /* ------------------------------------------------------------------ */

  CM.nextMessageId = function (data) {
    let max = 1000;
    (data.sessions || []).forEach((s) =>
      (s.events || []).forEach((e) => {
        const n = parseInt(e && e.message_id, 10);
        if (Number.isFinite(n) && n > max) max = n;
      })
    );
    const metaNext = data.meta && Number(data.meta.nextMessageId);
    if (Number.isFinite(metaNext) && metaNext > max) max = metaNext - 1;
    return max + 1;
  };

  CM.refreshDerived = function (data) {
    if (!data || typeof data !== 'object') return data;
    data.format = CM.FORMAT;
    data.version = 1;
    data.settings = Object.assign(CM.defaultSettings(), data.settings || {});
    data.self = data.self || { platform: data.settings.platform, user_id: '10000' };
    data.self.platform = data.settings.platform === 'wechat' ? 'wechat' : 'qq';
    data.self.user_id = String(data.self.user_id || '10000');
    data.characters = Array.isArray(data.characters) ? data.characters : [];
    data.files = data.files && typeof data.files === 'object' ? data.files : {};
    data.sessions = Array.isArray(data.sessions) ? data.sessions : [];
    if (!data.sessions.length) {
      data.sessions.push({
        id: CM.uid('sess'),
        title: tr('新群聊', 'New group chat'),
        detail_type: 'group',
        group_id: '100000001',
        user_id: '',
        member_count: 3,
        avatar: '👥',
        events: [],
      });
    }
    data.meta = data.meta || {};

    if (!data.characters.some((c) => String(c.user_id) === String(data.self.user_id))) {
      data.characters.unshift({
        user_id: String(data.self.user_id),
        name: tr('我', 'Me'),
        avatar: '🙂',
        avatarImage: '',
        color: '#93b4ff',
      });
    }
    data.characters.forEach((c, i) => {
      c.user_id = String(c.user_id || 10000 + i);
      c.name = c.name || tr('角色 {id}', 'Character {id}', { id: c.user_id });
      c.avatar = c.avatar || '🙂';
      c.avatarImage = c.avatarImage || '';
      c.color = c.color || CM.AVATAR_COLORS[i % CM.AVATAR_COLORS.length];
    });

    let nextId = CM.nextMessageId(data);
    data.sessions.forEach((s) => {
      s.id = s.id || CM.uid('sess');
      s.title = s.title || (s.detail_type === 'private' ? tr('私聊', 'Private chat') : tr('群聊', 'Group chat'));
      s.detail_type = s.detail_type === 'private' ? 'private' : 'group';
      s.group_id = String(s.group_id || '');
      s.user_id = String(s.user_id || '');
      s.member_count = Number(s.member_count) || 0;
      s.events = Array.isArray(s.events) ? s.events : [];
      s.events.forEach((ev) => {
        ev.id = ev.id || CM.uid('evt');
        ev.time = Number(ev.time) || CM.nowSec();
        ev.type = ev.type === 'notice' ? 'notice' : 'message';
        ev.sub_type = ev.sub_type == null ? '' : String(ev.sub_type);
        ev.self = { platform: data.self.platform, user_id: data.self.user_id };
        if (ev.type === 'message') {
          ev.detail_type = s.detail_type;
          ev.user_id = String(ev.user_id || '');
          ev.message_id = String(ev.message_id || nextId++);
          ev.message = Array.isArray(ev.message) ? ev.message : [];
          ev.message.forEach((seg) => {
            seg.data = seg.data && typeof seg.data === 'object' ? seg.data : {};
          });
          ev.alt_message = CM.altMessage(ev.message, data);
          if (s.detail_type === 'group') {
            ev.group_id = String(s.group_id || ev.group_id || '');
          } else {
            delete ev.group_id;
          }
        } else {
          ev.detail_type = ev.detail_type || 'group_member_increase';
          ev.user_id = String(ev.user_id || '');
          ev.operator_id = String(ev.operator_id || ev.user_id);
          if (s.detail_type === 'group' || CM.NOTICE_META[ev.detail_type]) {
            ev.group_id = String(ev.group_id || s.group_id || '');
          }
          if (ev.message_id) ev.message_id = String(ev.message_id);
        }
      });
    });
    data.meta.nextMessageId = nextId;
    data.updatedAt = new Date().toISOString();
    return data;
  };

  /* ------------------------------------------------------------------ */
  /* validation                                                          */
  /* ------------------------------------------------------------------ */

  const SEG_ALLOWED = {
    text: { text: 'string' },
    mention: { user_id: 'string' },
    mention_all: {},
    image: { file_id: 'string' },
    voice: { file_id: 'string' },
    audio: { file_id: 'string' },
    video: { file_id: 'string' },
    file: { file_id: 'string' },
    location: { latitude: 'number', longitude: 'number', title: 'string', content: 'string' },
    reply: { message_id: 'string', user_id: 'string' },
    'qq.face': { id: 'string' },
  };
  CM.SEG_ALLOWED = SEG_ALLOWED;

  function typeOk(v, t) {
    if (t === 'number') return typeof v === 'number' && Number.isFinite(v);
    if (t === 'string') return typeof v === 'string';
    return true;
  }

  CM.validate = function (data) {
    const out = [];
    const err = (text) => out.push({ level: 'error', text });
    const warn = (text) => out.push({ level: 'warn', text });

    if (!data || typeof data !== 'object') {
      err(tr('数据集不是对象', 'Dataset is not an object'));
      return out;
    }
    if (data.format !== CM.FORMAT) {
      warn(tr('format 字段不是 {format}，仍可尝试使用', 'format field is not {format}; it may still work', { format: CM.FORMAT }));
    }
    if (!data.self || !data.self.platform || !data.self.user_id) {
      err(tr('缺少机器人自身标识 self', 'Missing bot self identity (self)'));
    }
    if (!Array.isArray(data.characters)) err(tr('characters 不是数组', 'characters is not an array'));
    if (!Array.isArray(data.sessions)) err(tr('sessions 不是数组', 'sessions is not an array'));

    const seenUsers = {};
    (data.characters || []).forEach((c, i) => {
      if (!c || typeof c !== 'object') {
        return err(tr('角色 #{n} 不是对象', 'Character #{n} is not an object', { n: i + 1 }));
      }
      if (!c.user_id) err(tr('角色 #{n} 缺少 user_id', 'Character #{n} is missing user_id', { n: i + 1 }));
      if (c.user_id && seenUsers[c.user_id]) {
        err(tr('角色 user_id 重复：{id}', 'Duplicate character user_id: {id}', { id: c.user_id }));
      }
      if (c.user_id) seenUsers[c.user_id] = true;
      if (!c.name) {
        warn(tr('角色 {id} 没有昵称', 'Character {id} has no name', { id: c.user_id || '#' + (i + 1) }));
      }
    });

    const messageIds = {};
    (data.sessions || []).forEach((s, si) => {
      const label = tr('会话「{title}」', 'Session "{title}"', {
        title: (s && s.title) || tr('未命名', 'Untitled'),
      });
      if (!s || typeof s !== 'object') {
        return err(tr('{label} 不是对象', '{label} is not an object', { label }));
      }
      if (!s.id) err(tr('{label} 缺少 id', '{label} is missing id', { label }));
      if (s.detail_type !== 'group' && s.detail_type !== 'private') {
        err(tr('{label} detail_type 必须是 group/private', '{label} detail_type must be group/private', { label }));
      }
      if (!Array.isArray(s.events)) {
        return err(tr('{label} events 不是数组', '{label} events is not an array', { label }));
      }
      s.events.forEach((ev, ei) => {
        const tag = tr('{label} 第 {n} 条', '{label} item {n}', { label, n: ei + 1 });
        if (!ev || typeof ev !== 'object') {
          return err(tr('{tag} 不是对象', '{tag} is not an object', { tag }));
        }
        ['id', 'type', 'detail_type', 'sub_type', 'self'].forEach((k) => {
          if (ev[k] == null) err(tr('{tag} 缺少 {key}', '{tag} is missing {key}', { tag, key: k }));
        });
        if (typeof ev.time !== 'number' || !Number.isFinite(ev.time)) {
          err(tr('{tag} time 必须是数字（Unix 秒）', '{tag} time must be a number (Unix seconds)', { tag }));
        }
        if (!['message', 'notice', 'request', 'meta'].includes(ev.type)) {
          err(tr('{tag} type 非法：{type}', '{tag} has invalid type: {type}', { tag, type: ev.type }));
        }
        if (ev.self && (!ev.self.platform || !ev.self.user_id)) {
          err(tr('{tag} self 缺少 platform/user_id', '{tag} self is missing platform/user_id', { tag }));
        }

        if (ev.type === 'message') {
          if (!['private', 'group'].includes(ev.detail_type)) {
            err(tr('{tag} detail_type 必须是 private/group', '{tag} detail_type must be private/group', { tag }));
          }
          if (!ev.message_id) err(tr('{tag} 缺少 message_id', '{tag} is missing message_id', { tag }));
          if (messageIds[ev.message_id]) {
            warn(tr('{tag} message_id 重复：{id}', '{tag} has duplicate message_id: {id}', { tag, id: ev.message_id }));
          }
          messageIds[ev.message_id] = true;
          if (!Array.isArray(ev.message)) {
            return err(tr('{tag} message 必须是消息段数组', '{tag} message must be an array of segments', { tag }));
          }
          if (typeof ev.alt_message !== 'string') {
            warn(tr('{tag} alt_message 建议为字符串', '{tag} alt_message should be a string', { tag }));
          }
          if (!ev.user_id) err(tr('{tag} 缺少 user_id', '{tag} is missing user_id', { tag }));
          if (ev.detail_type === 'group' && !ev.group_id) {
            err(tr('{tag} 群消息缺少 group_id', '{tag} group message is missing group_id', { tag }));
          }
          ev.message.forEach((seg, gi) => {
            const stag = tr('{tag} 消息段 {n}', '{tag} segment {n}', { tag, n: gi + 1 });
            if (!seg || typeof seg !== 'object') {
              return err(tr('{stag} 不是对象', '{stag} is not an object', { stag }));
            }
            if (typeof seg.type !== 'string') {
              return err(tr('{stag} 缺少 type', '{stag} is missing type', { stag }));
            }
            if (!seg.data || typeof seg.data !== 'object') {
              return err(tr('{stag} 缺少 data 对象', '{stag} is missing the data object', { stag }));
            }
            if (Object.prototype.hasOwnProperty.call(seg.data, 'type')) {
              err(tr('{stag} data 不得包含保留字段 type', '{stag} data must not contain the reserved field type', { stag }));
            }
            const allowed = SEG_ALLOWED[seg.type];
            if (!allowed) {
              warn(
                tr('{stag} 使用了扩展消息段 {type}，渲染器可能忽略', '{stag} uses extended segment {type}; the renderer may ignore it', {
                  stag,
                  type: seg.type,
                })
              );
              return;
            }
            Object.keys(allowed).forEach((k) => {
              if (seg.data[k] == null) {
                warn(tr('{stag} 缺少参数 {key}', '{stag} is missing parameter {key}', { stag, key: k }));
              } else if (!typeOk(seg.data[k], allowed[k])) {
                err(
                  tr('{stag} 参数 {key} 类型应为 {type}', '{stag} parameter {key} should be of type {type}', {
                    stag,
                    key: k,
                    type: allowed[k],
                  })
                );
              }
            });
            Object.keys(seg.data).forEach((k) => {
              if (!(k in allowed)) {
                warn(tr('{stag} 包含非标准参数 {key}', '{stag} contains non-standard parameter {key}', { stag, key: k }));
              }
            });
            if (['image', 'voice', 'audio', 'video', 'file'].includes(seg.type) && seg.data.file_id) {
              if (!data.files || !data.files[seg.data.file_id]) {
                warn(
                  tr(
                    '{stag} 引用的文件 {id} 不在本地文件表中',
                    '{stag} references file {id}, which is not in the local file table',
                    { stag, id: seg.data.file_id }
                  )
                );
              }
            }
          });
        } else if (ev.type === 'notice') {
          const meta = CM.NOTICE_META[ev.detail_type];
          if (!meta) {
            warn(tr('{tag} 使用扩展通知事件 {type}', '{tag} uses extended notice event {type}', {
              tag,
              type: ev.detail_type,
            }));
          } else if (!meta.subTypes.includes(ev.sub_type) && ev.sub_type !== '') {
            warn(
              tr('{tag} sub_type 不在标准取值内：{sub}', '{tag} sub_type is not a standard value: {sub}', {
                tag,
                sub: ev.sub_type,
              })
            );
          }
          if (!ev.user_id) err(tr('{tag} 缺少 user_id', '{tag} is missing user_id', { tag }));
          if (!ev.operator_id) err(tr('{tag} 缺少 operator_id', '{tag} is missing operator_id', { tag }));
          if (ev.detail_type === 'group_message_delete' && !ev.message_id) {
            err(tr('{tag} 缺少 message_id', '{tag} is missing message_id', { tag }));
          }
        }
      });
    });

    const errCount = out.filter((x) => x.level === 'error').length;
    const warnCount = out.length - errCount;
    return Object.assign(out, { errors: errCount, warnings: warnCount });
  };

  /* ------------------------------------------------------------------ */
  /* local storage                                                       */
  /* ------------------------------------------------------------------ */

  CM.store = {
    data: null,
    available: true,
    undoStack: [],
    redoStack: [],
    maxUndo: 40,
    onStatus: null,
    _saveTimer: 0,
    _pendingUndo: false,
    _lastBytes: 0,

    init() {
      let raw = null;
      try {
        raw = localStorage.getItem(CM.STORAGE_KEY);
        if (!raw) {
          const legacy = localStorage.getItem(CM.LEGACY_STORAGE_KEY);
          if (legacy) {
            raw = legacy;
            // Keep the old key for rollback, but make the new key canonical.
            try {
              localStorage.setItem(CM.STORAGE_KEY, legacy);
            } catch (_) {}
          }
        }
      } catch (e) {
        this.available = false;
      }
      if (raw) {
        try {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.sessions) && Array.isArray(parsed.characters)) {
            this.data = CM.refreshDerived(parsed);
          }
        } catch (e) {
          try {
            localStorage.setItem(CM.STORAGE_KEY + ':broken', raw);
          } catch (_) {}
        }
      }
      if (!this.data) this.data = CM.buildDemo();
      CM.refreshDerived(this.data);
      this.saveNow();
      return this.data;
    },

    snapshot() {
      try {
        this.undoStack.push(CM.clone(this.data));
        if (this.undoStack.length > this.maxUndo) this.undoStack.shift();
        this.redoStack.length = 0;
      } catch (e) {}
    },

    beginEdit() {
      this._pendingUndo = true;
    },

    commit(fn, opts) {
      const history = !opts || opts.history !== false;
      if (history) this.snapshot();
      fn(this.data);
      CM.refreshDerived(this.data);
      this._pendingUndo = false;
      this.saveSoon();
      return this.data;
    },

    /** live edit: snapshot once per focus session, then update in place */
    live(fn) {
      if (this._pendingUndo) {
        this.snapshot();
        this._pendingUndo = false;
      }
      fn(this.data);
      CM.refreshDerived(this.data);
      this.saveSoon();
      return this.data;
    },

    undo() {
      if (!this.undoStack.length) return false;
      this.redoStack.push(CM.clone(this.data));
      this.data = this.undoStack.pop();
      CM.refreshDerived(this.data);
      this.saveNow();
      return true;
    },
    redo() {
      if (!this.redoStack.length) return false;
      this.undoStack.push(CM.clone(this.data));
      this.data = this.redoStack.pop();
      CM.refreshDerived(this.data);
      this.saveNow();
      return true;
    },
    canUndo() {
      return this.undoStack.length > 0;
    },
    canRedo() {
      return this.redoStack.length > 0;
    },

    replace(data, opts) {
      if (!data) return false;
      if (!opts || opts.history !== false) this.snapshot();
      this.data = CM.refreshDerived(data);
      this.saveNow();
      return true;
    },

    saveSoon() {
      clearTimeout(this._saveTimer);
      this._saveTimer = setTimeout(() => this.saveNow(), 260);
    },

    saveNow() {
      clearTimeout(this._saveTimer);
      if (!this.data) return;
      const json = JSON.stringify(this.data);
      try {
        if (!this.available) throw new Error(tr('localStorage 不可用', 'localStorage is unavailable'));
        localStorage.setItem(CM.STORAGE_KEY, json);
        this._lastBytes = new Blob([json]).size;
        if (this.onStatus) this.onStatus({ ok: true, bytes: this._lastBytes, at: new Date() });
      } catch (e) {
        this._lastBytes = new Blob([json]).size;
        if (this.onStatus) {
          this.onStatus({
            ok: false,
            bytes: this._lastBytes,
            at: new Date(),
            message:
              e && e.name === 'QuotaExceededError'
                ? tr('本地存储空间已满', 'Local storage is full')
                : e.message || tr('保存失败', 'Save failed'),
          });
        }
      }
    },

    bytes() {
      try {
        return new Blob([JSON.stringify(this.data)]).size;
      } catch (e) {
        return 0;
      }
    },
  };

  /** bytes referenced by a data URL, for the storage panel */
  CM.byteSize = function (str) {
    if (!str) return 0;
    if (str.indexOf('base64,') >= 0) {
      const b64 = str.slice(str.indexOf('base64,') + 7);
      return Math.floor((b64.length * 3) / 4);
    }
    return new Blob([str]).size;
  };

  CM.usedFileIds = function (data) {
    const used = new Set();
    (data.sessions || []).forEach((s) =>
      (s.events || []).forEach((ev) => {
        if (ev.type !== 'message') return;
        (ev.message || []).forEach((seg) => {
          if (seg && seg.data && seg.data.file_id) used.add(String(seg.data.file_id));
        });
      })
    );
    return used;
  };

  CM.noticeText = function (data, ev) {
    const name = (id) => CM.charName(data, id);
    switch (ev.detail_type) {
      case 'group_member_increase':
        if (ev.sub_type === 'invite') {
          return tr('{operator} 邀请 {user} 加入了群聊', '{operator} invited {user} to the group chat', {
            operator: name(ev.operator_id),
            user: name(ev.user_id),
          });
        }
        return tr('{user} 加入了群聊', '{user} joined the group chat', { user: name(ev.user_id) });
      case 'group_member_decrease':
        if (ev.sub_type === 'kick') {
          return tr('{user} 被 {operator} 移出了群聊', '{user} was removed from the group chat by {operator}', {
            user: name(ev.user_id),
            operator: name(ev.operator_id),
          });
        }
        return tr('{user} 退出了群聊', '{user} left the group chat', { user: name(ev.user_id) });
      case 'group_message_delete': {
        const who = String(ev.operator_id) === CM.selfId(data) ? tr('你', 'You') : name(ev.operator_id);
        if (ev.sub_type === 'delete') {
          return tr('{who} 删除了一条消息', '{who} deleted a message', { who });
        }
        return tr('{who} 撤回了一条消息', '{who} recalled a message', { who });
      }
      case 'friend_increase':
        return tr('你们已成为好友', 'You are now friends');
      case 'friend_decrease':
        return tr('{user} 与你解除了好友关系', '{user} removed you as a friend', { user: name(ev.user_id) });
      default:
        return '[' + ev.detail_type + ']';
    }
  };

  CM.sessionLastTime = function (s) {
    let t = 0;
    (s.events || []).forEach((e) => {
      if (e.time > t) t = e.time;
    });
    return t;
  };
  CM.sessionPreview = function (data, s) {
    const ev = (s.events || [])[s.events.length - 1];
    if (!ev) return tr('还没有消息', 'No messages yet');
    if (ev.type === 'notice') return CM.noticeText(data, ev);
    let text = ev.alt_message || CM.altMessage(ev.message, data);
    if (!text) text = tr('[消息]', '[Message]');
    return text.replace(/\n+/g, ' ');
  };
})();

</script>
<script>
/* render.js — pure canvas renderer for the chat mockup (no DOM, no network) */
(function () {
  'use strict';
  const CM = window.CM;
  const R = (CM.render = {});
  const tr = (zh, en, vars) => CM.i18n.tr(zh, en, vars);

  const W = CM.DESIGN_WIDTH;
  const PAD = 14;
  const AV = 40;
  const AV_GAP = 10;
  const BPX = 12;
  const BPY = 9;
  const MAX_CANVAS = 32000;

  const mctx = document.createElement('canvas').getContext('2d');
  const imgCache = new Map();

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const font = (size, weight) => (weight || 400) + ' ' + size + 'px ' + CM.FONT;
  const textW = (s, f) => {
    mctx.font = f;
    return mctx.measureText(s).width;
  };

  function rr(ctx, x, y, w, h, r) {
    const rad = Math.max(0, Math.min(r, Math.min(w, h) / 2));
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, rad);
    else {
      ctx.moveTo(x + rad, y);
      ctx.arcTo(x + w, y, x + w, y + h, rad);
      ctx.arcTo(x + w, y + h, x, y + h, rad);
      ctx.arcTo(x, y + h, x, y, rad);
      ctx.arcTo(x, y, x + w, y, rad);
      ctx.closePath();
    }
  }

  function ellipsize(text, f, maxW) {
    if (textW(text, f) <= maxW) return text;
    let out = '';
    const chars = Array.from(String(text));
    for (let i = 0; i < chars.length; i++) {
      if (textW(out + chars[i] + '…', f) > maxW) break;
      out += chars[i];
    }
    return out + '…';
  }

  function wrapLines(text, f, maxW) {
    const lines = [];
    let line = '';
    for (const ch of Array.from(String(text))) {
      if (ch === '\n') {
        lines.push(line);
        line = '';
        continue;
      }
      const test = line + ch;
      if (textW(test, f) > maxW && line) {
        lines.push(line);
        line = ch;
      } else {
        line = test;
      }
    }
    lines.push(line);
    return lines;
  }

  /* ------------------------------------------------------------------ */
  /* images                                                              */
  /* ------------------------------------------------------------------ */

  function loadImage(url) {
    if (!url) return Promise.resolve(null);
    if (imgCache.has(url)) return imgCache.get(url);
    const p = new Promise((resolve) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => resolve(null);
      img.src = url;
    });
