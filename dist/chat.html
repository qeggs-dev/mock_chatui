    imgCache.set(url, p);
    return p;
  }
  R.loadImage = loadImage;
  R.image = (url) => {
    const p = imgCache.get(url);
    return p && p.__img ? p.__img : null;
  };

  R.prepare = async function (data) {
    const urls = new Set();
    Object.keys(data.files || {}).forEach((id) => {
      const f = data.files[id];
      if (f && f.dataUrl) urls.add(f.dataUrl);
    });
    (data.characters || []).forEach((c) => {
      if (c.avatarImage) urls.add(c.avatarImage);
    });
    if (data.settings && data.settings.backgroundImage) urls.add(data.settings.backgroundImage);
    const jobs = [];
    urls.forEach((u) => {
      const p = loadImage(u);
      jobs.push(
        p.then((img) => {
          p.__img = img;
        })
      );
    });
    await Promise.all(jobs);
    await (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve());
    return true;
  };
  R.clearCache = () => imgCache.clear();

  /* ------------------------------------------------------------------ */
  /* inline text layout                                                  */
  /* ------------------------------------------------------------------ */

  function tokenize(str) {
    const out = [];
    let word = '';
    for (const ch of Array.from(str)) {
      const code = ch.codePointAt(0);
      const wide = code >= 0x2e80 || code >= 0x1f000;
      if (/\s/.test(ch) || wide) {
        if (word) {
          out.push(word);
          word = '';
        }
        out.push(ch);
      } else {
        word += ch;
      }
    }
    if (word) out.push(word);
    return out;
  }

  function wrapAtoms(atoms, maxW) {
    const lines = [];
    let cur = [];
    let curW = 0;
    const flush = () => {
      lines.push(cur);
      cur = [];
      curW = 0;
    };
    for (const atom of atoms) {
      if (atom.nl) {
        flush();
        continue;
      }
      const f = atom.font;
      for (const raw of tokenize(atom.text)) {
        const w = textW(raw, f);
        if (curW + w > maxW && curW > 0) flush();
        if (w > maxW) {
          for (const ch of Array.from(raw)) {
            const cw = textW(ch, f);
            if (curW + cw > maxW && curW > 0) flush();
            cur.push({ text: ch, font: f, color: atom.color, w: cw, emoji: atom.emoji });
            curW += cw;
          }
        } else {
          cur.push({ text: raw, font: f, color: atom.color, w, emoji: atom.emoji });
          curW += w;
        }
      }
    }
    if (cur.length || !lines.length) flush();
    while (lines.length > 1 && lines[lines.length - 1].length === 0) lines.pop();
    const merged = lines.map((line) => {
      const runs = [];
      line.forEach((tok) => {
        const last = runs[runs.length - 1];
        if (last && last.font === tok.font && last.color === tok.color && !tok.emoji && !last.emoji) {
          last.text += tok.text;
          last.w += tok.w;
        } else {
          runs.push({ text: tok.text, font: tok.font, color: tok.color, w: tok.w, emoji: tok.emoji });
        }
      });
      return { runs, w: runs.reduce((a, b) => a + b.w, 0) };
    });
    return merged;
  }

  /* ------------------------------------------------------------------ */
  /* content measurement                                                 */
  /* ------------------------------------------------------------------ */

  function fileOf(data, id) {
    return (data.files && data.files[id]) || null;
  }

  function imgOfFile(data, id) {
    const f = fileOf(data, id);
    if (!f || !f.dataUrl) return null;
    return R.image(f.dataUrl);
  }

  function quoteInfo(data, session, seg) {
    const d = seg.data || {};
    let target = null;
    for (const ev of session.events || []) {
      if (ev.type === 'message' && String(ev.message_id) === String(d.message_id)) {
        target = ev;
        break;
      }
    }
    let name = '';
    let text = '';
    if (target) {
      name = CM.charName(data, target.user_id);
      text = CM.altMessage(target.message, data).replace(/\n+/g, ' ') || tr('[消息]', '[Message]');
    } else {
      name = d.user_id ? CM.charName(data, d.user_id) : tr('原消息', 'Original message');
      text = tr('消息已不存在', 'Message no longer exists');
    }
    return { name, text };
  }

  function buildContent(data, session, ev, theme, fs, maxContentW, isSelf) {
    const lh = Math.round(fs * 1.42);
    const padTopGap = 6;
    const parts = [];
    let atoms = [];
    let quote = null;

    const baseColor = isSelf ? theme.selfText : theme.otherText;
    const mentionColor = isSelf ? theme.selfAccent : theme.accent;

    const flush = () => {
      if (!atoms.length) return;
      const lines = wrapAtoms(atoms, maxContentW);
      const h = Math.max(1, lines.length) * lh;
      const w = lines.reduce((a, l) => Math.max(a, l.w), 0);
      parts.push({ kind: 'lines', lines, w, h });
      atoms = [];
    };

    for (const seg of ev.message || []) {
      const d = (seg && seg.data) || {};
      if (seg.type === 'reply') {
        if (!quote) {
          const info = quoteInfo(data, session, seg);
          const qf = font(11.5, 600);
          const sf = font(11.5, 400);
          const nameF = font(11.5, 600);
          const maxQ = maxContentW - 18;
          const nameW = Math.min(textW(info.name, nameF) + 2, maxQ * 0.45);
          const sumW = Math.max(40, maxQ - nameW - 10);
          const qw = Math.min(maxContentW, nameW + 10 + Math.min(sumW, textW(info.text, sf)) + 18);
          quote = {
            kind: 'quote',
            w: Math.max(120, qw),
            h: 36,
            name: info.name,
            text: info.text,
            nameF,
            sf,
            nameW,
            sumW,
          };
        }
        continue;
      }
      if (seg.type === 'text') {
        const raw = String(d.text == null ? '' : d.text);
        const pieces = raw.split('\n');
        pieces.forEach((p, i) => {
          if (i) atoms.push({ nl: true });
          if (p) atoms.push({ text: p, font: font(fs), color: baseColor });
        });
        continue;
      }
      if (seg.type === 'mention') {
        const name = CM.charName(data, d.user_id);
        atoms.push({ text: '@' + name, font: font(fs, 600), color: mentionColor, emoji: true });
        continue;
      }
      if (seg.type === 'mention_all') {
        atoms.push({ text: tr('@全体成员', '@all'), font: font(fs, 600), color: mentionColor, emoji: true });
        continue;
      }
      if (seg.type === 'qq.face') {
        const f = CM.faceOf(d.id);
        atoms.push({ text: f.emoji, font: font(Math.round(fs * 1.18)), color: baseColor, emoji: true });
        continue;
      }
      if (seg.type === 'image') {
        flush();
        const raw = imgOfFile(data, d.file_id);
        let iw = 210;
        let ih = 140;
        if (raw) {
          const maxW = Math.min(232, maxContentW);
          const maxH = 280;
          const scale = Math.min(maxW / raw.naturalWidth, maxH / raw.naturalHeight, 1);
          iw = Math.max(48, Math.round(raw.naturalWidth * scale));
          ih = Math.max(48, Math.round(raw.naturalHeight * scale));
        }
        parts.push({ kind: 'image', w: iw, h: ih, img: raw, id: d.file_id });
        continue;
      }
      if (seg.type === 'voice') {
        flush();
        const f = fileOf(data, d.file_id) || {};
        const dur = clamp(Number(f.duration) || 3, 1, 60);
        const vw = clamp(76 + dur * 13, 92, Math.min(210, maxContentW));
        parts.push({ kind: 'voice', w: vw, h: 36, duration: dur });
        continue;
      }
      if (seg.type === 'audio' || seg.type === 'video') {
        flush();
        const f = fileOf(data, d.file_id) || {};
        const dur = Number(f.duration) || 0;
        const label = f.name || (seg.type === 'video' ? tr('视频', 'Video') : tr('音频', 'Audio'));
        parts.push({
          kind: seg.type,
          w: Math.min(240, maxContentW),
          h: 62,
          label,
          duration: dur,
          size: f.size || 0,
        });
        continue;
      }
      if (seg.type === 'file') {
        flush();
        const f = fileOf(data, d.file_id) || {};
        parts.push({
          kind: 'file',
          w: Math.min(242, maxContentW),
          h: 64,
          name: f.name || tr('未命名文件', 'Untitled file'),
          size: f.size || 0,
        });
        continue;
      }
      if (seg.type === 'location') {
        flush();
        parts.push({
          kind: 'location',
          w: Math.min(242, maxContentW),
          h: 96,
          title: d.title || tr('位置', 'Location'),
          content: d.content || '',
        });
        continue;
      }
      // unknown / extended segment: render an inline marker
      atoms.push({ text: '[' + seg.type + ']', font: font(fs), color: theme.noticeText });
    }
    flush();

    if (quote) parts.unshift(quote);

    const contentW = parts.reduce((a, p) => Math.max(a, p.w), 0);
    const contentH = parts.reduce((a, p, i) => a + p.h + (i ? padTopGap : 0), 0);
    return { parts, contentW, contentH };
  }

  /* ------------------------------------------------------------------ */
  /* message layout                                                      */
  /* ------------------------------------------------------------------ */

  function layoutMessage(data, session, ev, theme, cfg, index) {
    const fs = cfg.fontSize;
    const isSelf = String(ev.user_id) === String(data.self.user_id);
    const chars = CM.charMap(data);
    const ch = chars[ev.user_id] || null;
    const name = CM.charName(data, ev.user_id);
    const maxContentW = cfg.bubbleMax - BPX * 2;
    const content = buildContent(data, session, ev, theme, fs, maxContentW, isSelf);

    if (!content.parts.length) return null;
    const onlyKind = content.parts.length === 1 ? content.parts[0].kind : '';
    const mediaOnly = onlyKind === 'image';
    const cardOnly = ['file', 'location', 'audio', 'video'].includes(onlyKind);
    const voiceOnly = onlyKind === 'voice';
    const padX = mediaOnly || cardOnly || voiceOnly ? 0 : BPX;
    const padY = mediaOnly ? 0 : BPY;

    let bubbleW = content.contentW + padX * 2;
    let bubbleH = content.contentH + padY * 2;
    if (mediaOnly && content.parts[0]) {
      bubbleW = content.parts[0].w;
      bubbleH = content.parts[0].h;
    }
    bubbleW = Math.min(cfg.bubbleMax, Math.max(44, bubbleW));
    const showName = session.detail_type === 'group' && !isSelf && cfg.showNames;
    const nameH = showName ? 17 : 0;
    const rowH = nameH + bubbleH;

    return {
      kind: 'msg',
      eventId: ev.id,
      eventIndex: index,
      y: 0,
      h: rowH,
      isSelf,
      name,
      ch,
      nameH,
      bubble: {
        w: bubbleW,
        h: bubbleH,
        padX,
        padY,
        mediaOnly,
        cardOnly,
        voiceOnly,
        content,
        radius: mediaOnly ? 8 : theme.bubbleRadius,
      },
    };
  }

  /* ------------------------------------------------------------------ */
  /* layout                                                              */
  /* ------------------------------------------------------------------ */

  R.layout = function (data, session, opts) {
    opts = opts || {};
    const settings = data.settings || {};
    const cfg = {
      fontSize: clamp(Number(settings.fontSize) || 15, 13, 19),
      bubbleMax: clamp(Number(settings.bubbleWidth) || 258, 200, 310),
      gapMinutes: clamp(Number(settings.gapMinutes) || 5, 0, 1440),
      showNames: settings.showNames !== false,
      showHeader: opts.includeHeader != null ? !!opts.includeHeader : settings.showHeader !== false,
      showStatus:
        opts.includeStatus != null ? !!opts.includeStatus : settings.showStatus !== false,
      selectedId: opts.selectedId ? String(opts.selectedId) : '',
    };
    if (!cfg.showHeader) cfg.showStatus = false;
    const theme = CM.theme(settings);
    const statusH = cfg.showStatus ? 44 : 0;
    const headerH = cfg.showHeader ? 54 : 0;

    const recalled = new Set();
    (session.events || []).forEach((ev) => {
      if (ev.type === 'notice' && ev.detail_type === 'group_message_delete' && ev.message_id) {
        recalled.add(String(ev.message_id));
      }
    });

    const items = [];
    let y = statusH + headerH + (cfg.showHeader ? 6 : 10);
    let lastTime = null;

    (session.events || []).forEach((ev, index) => {
      if (ev.type === 'message' && recalled.has(String(ev.message_id))) return;
      const t = Number(ev.time) || 0;
      const prevDay = lastTime == null ? null : new Date(lastTime * 1000).toDateString();
      const day = new Date(t * 1000).toDateString();
      const needTime =
        lastTime == null || (t - lastTime) / 60 >= cfg.gapMinutes || (prevDay && day !== prevDay);
      if (needTime) {
        y += items.length ? 8 : 0;
        items.push({ kind: 'time', text: CM.fmtDivider(t), y, h: 22 });
        y += 22;
      }
      if (ev.type === 'notice') {
        y += 8;
        const text = CM.noticeText(data, ev);
        items.push({ kind: 'notice', text, y, h: 24, eventId: ev.id });
        y += 24;
      } else {
        const m = layoutMessage(data, session, ev, theme, cfg, index);
        if (m) {
          y += 14;
          m.y = y;
          items.push(m);
          y += m.h;
        }
      }
      lastTime = t;
    });

    const empty = !items.some((i) => i.kind === 'msg');
    if (empty) y += 120;
    const height = Math.max(y + 20, statusH + headerH + 120);

    return {
      width: W,
      height,
      theme,
      cfg,
      items,
      session,
      data,
      statusH,
      headerH,
      empty,
      lastTime,
    };
  };

  /* ------------------------------------------------------------------ */
  /* drawing primitives                                                  */
  /* ------------------------------------------------------------------ */

  function drawAvatar(ctx, ch, x, y, size, theme) {
    const r = theme.platform === 'wechat' ? theme.avatarRadius : size / 2;
    ctx.save();
    rr(ctx, x, y, size, size, r);
    ctx.clip();
    const img = ch && ch.avatarImage ? R.image(ch.avatarImage) : null;
    if (img && img.naturalWidth) {
      const s = Math.max(size / img.naturalWidth, size / img.naturalHeight);
      const dw = img.naturalWidth * s;
      const dh = img.naturalHeight * s;
      ctx.drawImage(img, x + (size - dw) / 2, y + (size - dh) / 2, dw, dh);
    } else {
      ctx.fillStyle = (ch && ch.color) || '#93b4ff';
      ctx.fillRect(x, y, size, size);
      ctx.fillStyle = '#ffffff';
      ctx.font = font(Math.round(size * 0.52), 400);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText((ch && ch.avatar) || '🙂', x + size / 2, y + size / 2 + 1);
    }
    ctx.restore();
    ctx.save();
    rr(ctx, x, y, size, size, r);
    ctx.strokeStyle = 'rgba(0,0,0,.06)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();
  }

  function drawStatusBar(ctx, layout) {
    const { theme, cfg, session } = layout;
    const settings = layout.data.settings;
    const statusH = layout.statusH;
    if (!cfg.showStatus || !cfg.showHeader) return;
    ctx.save();
    ctx.fillStyle = theme.headerBg;
    ctx.fillRect(0, 0, W, statusH);

    const st = settings.statusTime && /^\d{1,2}:\d{2}$/.test(settings.statusTime)
      ? settings.statusTime
      : CM.fmtClock(layout.lastTime || CM.nowSec());
    ctx.fillStyle = theme.statusText;
    ctx.font = font(13, 600);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(st, 24, 28);

    // signal
    const sx = W - 78;
    ctx.fillStyle = theme.statusText;
    [4, 6, 8, 10].forEach((h, i) => {
      rr(ctx, sx + i * 5, 28 - h, 3, h, 1);
      ctx.fill();
    });
    // wifi
    const wx = W - 48;
    const wy = 29;
    ctx.strokeStyle = theme.statusText;
    ctx.lineWidth = 1.7;
    ctx.lineCap = 'round';
    [3.5, 6.5, 9.5].forEach((rad, i) => {
      ctx.beginPath();
      ctx.arc(wx, wy + 3, rad, Math.PI * 1.22, Math.PI * 1.78);
      ctx.stroke();
    });
    ctx.beginPath();
    ctx.arc(wx, wy + 3, 1.4, 0, Math.PI * 2);
    ctx.fillStyle = theme.statusText;
    ctx.fill();
    // battery
    const bx = W - 30;
    const by = 18;
    ctx.strokeStyle = theme.statusText;
    ctx.lineWidth = 1.2;
    rr(ctx, bx, by, 20, 10, 2.5);
    ctx.stroke();
    ctx.fillStyle = theme.statusText;
    rr(ctx, bx + 2.5, by + 2.5, 11, 5, 1);
    ctx.fill();
    rr(ctx, bx + 21, by + 3.5, 2, 3, 1);
    ctx.fill();
    ctx.restore();
  }

  function drawHeader(ctx, layout) {
    const { theme, cfg, session } = layout;
    if (!cfg.showHeader) return;
    const y0 = layout.statusH;
    const h = layout.headerH;
    ctx.save();
    ctx.fillStyle = theme.headerBg;
    ctx.fillRect(0, y0, W, h);
    // hairline
    ctx.fillStyle = theme.headerLine;
    ctx.fillRect(0, y0 + h - 1, W, 1);

    // back chevron
    ctx.strokeStyle = theme.headerText;
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(23, y0 + h / 2 - 8);
    ctx.lineTo(15, y0 + h / 2);
    ctx.lineTo(23, y0 + h / 2 + 8);
    ctx.stroke();

    const subtitle =
      theme.platform === 'qq' && session.detail_type === 'group'
        ? session.member_count
          ? tr('{n}人', '{n} members', { n: session.member_count })
          : tr('群聊', 'Group chat')
        : theme.platform === 'qq'
        ? tr('在线', 'Online')
        : '';

    const titleY = subtitle ? y0 + 31 : y0 + h / 2 + 6;
    ctx.fillStyle = theme.headerText;
    ctx.font = font(17, 600);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(ellipsize(session.title || '', font(17, 600), W - 130), W / 2, titleY);
    if (subtitle) {
      ctx.fillStyle = theme.headerSub;
      ctx.font = font(10.5, 400);
      ctx.fillText(subtitle, W / 2, y0 + 46);
    }

    // three dots
    ctx.fillStyle = theme.headerText;
    const dx = W - 28;
    const dy = y0 + h / 2;
    [-6, 0, 6].forEach((o) => {
      ctx.beginPath();
      ctx.arc(dx + o, dy, 1.7, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();
  }

  function drawBackground(ctx, layout) {
    const { theme, height } = layout;
    const settings = layout.data.settings;
    if (settings.backgroundImage) {
      const img = R.image(settings.backgroundImage);
      if (img && img.naturalWidth) {
        const s = Math.max(W / img.naturalWidth, height / img.naturalHeight);
        const dw = img.naturalWidth * s;
        const dh = img.naturalHeight * s;
        ctx.drawImage(img, (W - dw) / 2, (height - dh) / 2, dw, dh);
        ctx.fillStyle = theme.mode === 'dark' ? 'rgba(0,0,0,.18)' : 'rgba(255,255,255,.08)';
        ctx.fillRect(0, 0, W, height);
        return;
      }
    }
    ctx.fillStyle = settings.backgroundTint || theme.bg;
    ctx.fillRect(0, 0, W, height);
  }

  function drawTime(ctx, item, layout) {
    const { theme } = layout;
    ctx.save();
    ctx.fillStyle = theme.time;
    ctx.font = font(11, 400);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(item.text, W / 2, item.y + item.h / 2 + 1);
    ctx.restore();
  }

  function drawNotice(ctx, item, layout) {
    const { theme } = layout;
    const f = font(11, 400);
    const label = ellipsize(item.text, f, W - 100);
    const tw = textW(label, f);
    const bw = tw + 22;
    const bh = 22;
    ctx.save();
    ctx.fillStyle = theme.noticeBg;
    rr(ctx, (W - bw) / 2, item.y + (item.h - bh) / 2, bw, bh, 5);
    ctx.fill();
    ctx.fillStyle = theme.noticeText;
    ctx.font = f;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, W / 2, item.y + item.h / 2 + 0.5);
    ctx.restore();
  }

  function drawQuote(ctx, q, x, y, theme, isSelf) {
    ctx.save();
    ctx.fillStyle = isSelf ? theme.selfQuoteBg : theme.quoteBg;
    rr(ctx, x, y, q.w, q.h, 4);
    ctx.fill();
    ctx.fillStyle = isSelf ? 'rgba(255,255,255,.6)' : theme.quoteBar;
    rr(ctx, x, y, 2.5, q.h, 1.2);
    ctx.fill();
    ctx.font = q.nameF;
    ctx.fillStyle = isSelf ? '#ffffff' : theme.accent;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    const nm = ellipsize(q.name, q.nameF, q.nameW);
    ctx.fillText(nm, x + 8, y + 13);
    const nw = textW(nm, q.nameF);
    ctx.font = q.sf;
    ctx.fillStyle = isSelf ? 'rgba(255,255,255,.78)' : theme.noticeText;
    const summary = ellipsize(q.text, q.sf, q.w - nw - 20);
    ctx.fillText(summary, x + 8 + nw + 5, y + 13);
    ctx.restore();
  }

  function drawLines(ctx, part, x, y, fs) {
    const lh = Math.round(fs * 1.42);
    ctx.save();
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    part.lines.forEach((line, i) => {
      let cx = x;
      const baseline = y + i * lh + lh / 2 + 0.5;
      line.runs.forEach((run) => {
        ctx.font = run.font;
        ctx.fillStyle = run.color;
        ctx.fillText(run.text, cx, baseline);
        cx += run.w;
      });
    });
    ctx.restore();
  }

  function drawVoice(ctx, part, x, y, theme, isSelf) {
    const color = isSelf ? theme.selfText : theme.otherText;
    const H = part.h;
    const bars = [7, 13, 19, 11, 16, 9];
    const bw = 3;
    const gap = 3;
    const startX = x + 14;
    ctx.save();
    ctx.fillStyle = color;
    ctx.globalAlpha = 0.85;
    bars.forEach((bh, i) => {
      rr(ctx, startX + i * (bw + gap), y + (H - bh) / 2, bw, bh, 1.5);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    ctx.font = font(12.5, 500);
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillText(part.duration + '″', x + part.w - 12, y + H / 2 + 0.5);
    ctx.restore();
  }

  function drawFileIcon(ctx, x, y, size, theme) {
    ctx.save();
    ctx.fillStyle = theme.fileIconBg;
    rr(ctx, x, y, size, size, 8);
    ctx.fill();
    const pw = size * 0.42;
    const ph = size * 0.54;
    const px = x + (size - pw) / 2;
    const py = y + (size - ph) / 2;
    ctx.fillStyle = theme.fileIconText;
    rr(ctx, px, py, pw, ph, 2);
    ctx.fill();
    ctx.fillStyle = theme.fileIconBg;
    for (let i = 0; i < 3; i++) {
      ctx.fillRect(px + 4, py + 6 + i * 5, pw - 8, 1.6);
    }
    ctx.restore();
  }

  function drawFile(ctx, part, x, y, theme, isSelf) {
    const cardText = isSelf ? theme.otherText : theme.otherText;
    ctx.save();
    drawFileIcon(ctx, x + 12, y + (part.h - 38) / 2, 38, theme);
    ctx.fillStyle = cardText;
    ctx.font = font(13, 600);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    const name = ellipsize(part.name, font(13, 600), part.w - 70);
    ctx.fillText(name, x + 62, y + 24);
    ctx.fillStyle = theme.cardSub;
    ctx.font = font(10.5, 400);
    ctx.fillText(CM.fmtBytes(part.size), x + 62, y + 44);
    ctx.restore();
  }

  function drawMedia(ctx, part, x, y, theme, isSelf) {
    const c = isSelf ? theme.otherText : theme.otherText;
    ctx.save();
    ctx.fillStyle = theme.fileIconBg;
    ctx.beginPath();
    ctx.arc(x + 34, y + part.h / 2, 18, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = theme.fileIconText;
    ctx.beginPath();
    const cx = x + 37;
    const cy = y + part.h / 2;
    ctx.moveTo(cx - 4, cy - 7);
    ctx.lineTo(cx + 8, cy);
    ctx.lineTo(cx - 4, cy + 7);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = c;
    ctx.font = font(13, 600);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(ellipsize(part.label, font(13, 600), part.w - 82), x + 62, y + 25);
    if (part.duration) {
      ctx.fillStyle = theme.cardSub;
      ctx.font = font(10.5, 400);
      ctx.fillText(part.duration + '″', x + 62, y + 44);
    }
    ctx.restore();
  }

  function drawLocation(ctx, part, x, y, theme, clipW) {
    ctx.save();
    rr(ctx, x, y, clipW, part.h, 6);
    ctx.clip();
    ctx.fillStyle = theme.mapBg;
    ctx.fillRect(x, y, clipW, part.h);
    // roads
    ctx.strokeStyle = theme.mapRoad;
    ctx.lineWidth = 9;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x - 10, y + 26);
    ctx.lineTo(x + clipW + 10, y + 44);
    ctx.stroke();
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(x + 40, y - 8);
    ctx.lineTo(x + 62, y + part.h + 8);
    ctx.stroke();
    // park
    ctx.fillStyle = theme.mapPark;
    rr(ctx, x + clipW - 78, y + 6, 66, 40, 10);
    ctx.fill();
    // water
    ctx.fillStyle = 'rgba(120,180,210,.45)';
    ctx.beginPath();
    ctx.ellipse(x + 36, y + 74, 60, 26, -0.3, 0, Math.PI * 2);
    ctx.fill();
    // pin
    const px = x + 42;
    const py = y + 40;
    ctx.fillStyle = '#ef5b5b';
    ctx.beginPath();
    ctx.arc(px, py - 8, 8, Math.PI * 0.15, Math.PI * 0.85);
    ctx.lineTo(px, py + 9);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(px, py - 8, 3, 0, Math.PI * 2);
    ctx.fill();
    // panel
    ctx.fillStyle = theme.mapPanel;
    ctx.fillRect(x, y + part.h - 40, clipW, 40);
    ctx.fillStyle = theme.mapText;
    ctx.font = font(12, 600);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(ellipsize(part.title, font(12, 600), clipW - 24), x + 12, y + part.h - 24);
    ctx.fillStyle = theme.cardSub;
    ctx.font = font(10, 400);
    ctx.fillText(ellipsize(part.content, font(10, 400), clipW - 24), x + 12, y + part.h - 9);
    ctx.restore();
  }

  function drawImageBlock(ctx, part, x, y, theme) {
    if (!part.img) {
      ctx.save();
      ctx.fillStyle = theme.fileBg;
      rr(ctx, x, y, part.w, part.h, 6);
      ctx.fill();
      ctx.fillStyle = theme.cardSub;
      ctx.font = font(12, 400);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(tr('图片不可用', 'Image unavailable'), x + part.w / 2, y + part.h / 2);
      ctx.restore();
      return;
    }
    ctx.save();
    rr(ctx, x, y, part.w, part.h, 6);
    ctx.clip();
    const s = Math.max(part.w / part.img.naturalWidth, part.h / part.img.naturalHeight);
    const dw = part.img.naturalWidth * s;
    const dh = part.img.naturalHeight * s;
    ctx.drawImage(part.img, x + (part.w - dw) / 2, y + (part.h - dh) / 2, dw, dh);
    ctx.restore();
  }

  function drawBubbleContent(ctx, msg, x, y, layout) {
    const { theme, cfg } = layout;
    const fs = cfg.fontSize;
    const isSelf = msg.isSelf;
    const b = msg.bubble;
    let cy = y;
    b.content.parts.forEach((part, i) => {
      if (i) cy += 6;
      if (part.kind === 'lines') {
        drawLines(ctx, part, x, cy, fs);
      } else if (part.kind === 'quote') {
        drawQuote(ctx, part, x, cy, theme, isSelf);
      } else if (part.kind === 'image') {
        drawImageBlock(ctx, part, x, cy, theme);
      } else if (part.kind === 'voice') {
        drawVoice(ctx, part, x, cy, theme, isSelf);
      } else if (part.kind === 'file') {
        drawFile(ctx, part, x, cy, theme, isSelf);
      } else if (part.kind === 'location') {
        drawLocation(ctx, part, x, cy, theme, part.w);
      } else if (part.kind === 'audio' || part.kind === 'video') {
        drawMedia(ctx, part, x, cy, theme, isSelf);
      }
      cy += part.h;
    });
  }

  function drawMessage(ctx, item, layout) {
    const { theme, cfg } = layout;
    const b = item.bubble;
    const avatarX = item.isSelf ? W - PAD - AV : PAD;
    const bubbleX = item.isSelf ? W - PAD - AV - AV_GAP - b.w : PAD + AV + AV_GAP;
    const bubbleY = item.y + item.nameH;

    if (item.nameH) {
      ctx.save();
      ctx.fillStyle = theme.name;
      ctx.font = font(11.5, 400);
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(ellipsize(item.name, font(11.5, 400), b.w - 4), bubbleX, bubbleY - 8);
      ctx.restore();
    }

    drawAvatar(ctx, item.ch, avatarX, bubbleY, AV, theme);

    if (!b.mediaOnly) {
      let bg = item.isSelf ? theme.selfBubble : theme.otherBubble;
      if (b.cardOnly) bg = theme.otherBubble;
      ctx.save();
      ctx.fillStyle = bg;
      rr(ctx, bubbleX, bubbleY, b.w, b.h, b.radius);
      ctx.fill();

      if (theme.tail && !b.cardOnly) {
        const ty = bubbleY + 13;
        ctx.beginPath();
        if (item.isSelf) {
          ctx.moveTo(bubbleX + b.w - 1, ty);
          ctx.lineTo(bubbleX + b.w + 7, ty + 4);
          ctx.lineTo(bubbleX + b.w - 1, ty + 10);
        } else {
          ctx.moveTo(bubbleX + 1, ty);
          ctx.lineTo(bubbleX - 7, ty + 4);
          ctx.lineTo(bubbleX + 1, ty + 10);
        }
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }

    const contentX = bubbleX + b.padX;
    const contentY = bubbleY + b.padY;
    drawBubbleContent(ctx, item, contentX, contentY, layout);
  }

  /* ------------------------------------------------------------------ */
  /* top-level draw                                                      */
  /* ------------------------------------------------------------------ */

  R.draw = function (ctx, layout) {
    ctx.save();
    ctx.textBaseline = 'alphabetic';
    drawBackground(ctx, layout);
    drawStatusBar(ctx, layout);
    drawHeader(ctx, layout);

    for (const item of layout.items) {
      if (item.kind === 'time') drawTime(ctx, item, layout);
      else if (item.kind === 'notice') drawNotice(ctx, item, layout);
      else if (item.kind === 'msg') drawMessage(ctx, item, layout);
    }

    if (layout.empty) {
      ctx.fillStyle = layout.theme.noticeText;
      ctx.font = font(12, 400);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(tr('还没有聊天记录', 'No chat history yet'), W / 2, layout.statusH + layout.headerH + 80);
    }

    if (layout.cfg.selectedId) {
      const sel = layout.items.find(
        (i) => i.kind === 'msg' && i.eventId === layout.cfg.selectedId
      );
      if (sel) drawSelection(ctx, sel, layout);
    }
    ctx.restore();
    return layout;
  };

  function drawSelection(ctx, item, layout) {
    const b = item.bubble;
    const bubbleX = item.isSelf ? W - PAD - AV - AV_GAP - b.w : PAD + AV + AV_GAP;
    const bubbleY = item.y + item.nameH;
    ctx.save();
    rr(ctx, bubbleX - 4, bubbleY - 4, b.w + 8, b.h + 8, b.radius + 4);
    ctx.strokeStyle = 'rgba(255,255,255,.9)';
    ctx.lineWidth = 5;
    ctx.stroke();
    rr(ctx, bubbleX - 2, bubbleY - 2, b.w + 4, b.h + 4, b.radius + 2);
    ctx.strokeStyle = '#0b84ff';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
  }

  R.render = async function (canvas, data, session, opts) {
    opts = opts || {};
    await R.prepare(data);
    const layout = R.layout(data, session, opts);
    let scale = Number(opts.scale) || 2;
    if (layout.height * scale > MAX_CANVAS) scale = Math.max(0.35, MAX_CANVAS / layout.height);
    canvas.width = Math.max(1, Math.round(W * scale));
    canvas.height = Math.max(1, Math.round(layout.height * scale));
    const ctx = canvas.getContext('2d');
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    R.draw(ctx, layout);
    return layout;
  };

  R.exportCanvas = async function (data, session, opts) {
    opts = opts || {};
    await R.prepare(data);
    const width = clamp(Number(opts.width) || 1080, 360, 2160);
    const scale = width / W;
    const layout = R.layout(data, session, opts);
    if (layout.height * scale > MAX_CANVAS || layout.height * scale * width > 268000000) {
      throw new Error(tr('聊天记录过长，无法导出为一张图片', 'The chat log is too long to export as a single image'));
    }
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(W * scale);
    canvas.height = Math.round(layout.height * scale);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    R.draw(ctx, layout);
    return { canvas, layout, width: canvas.width, height: canvas.height };
  };

  R.canvasToBlob = (canvas) =>
    new Promise((resolve) => {
      if (canvas.toBlob) canvas.toBlob(resolve, 'image/png');
      else resolve(null);
    });

  R.hitTest = function (layout, designY) {
    for (const item of layout.items) {
      if (item.kind !== 'msg') continue;
      if (designY >= item.y && designY <= item.y + item.h) return item;
    }
    return null;
  };
})();

</script>
<script>
/* ui.js — 直接编排 + 详细编辑器 + 抽屉 / 角色池 */
(function () {
  'use strict';
  const CM = window.CM;
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
  const esc = CM.esc;
  const tr = (zh, en, vars) => CM.i18n.tr(zh, en, vars);
  const NARROW = () => window.matchMedia('(max-width: 1180px)').matches;
  const OVERLAY = () => document.body.dataset.page === 'chat' || NARROW();

  const S = {
    sessionId: null,
    selectedId: null,
    freshEventId: null,
    composerUid: '',
    previewLayout: null,
    previewToken: 0,
    drag: null,
    dropIndex: null,
    dropY: 0,
    suppressClickAt: 0,
    saveWarned: false,
    rolePopOpen: false,
    modalKind: '',
    modalUid: '',
    confirmResolve: null,
    confirmOpts: null,
    saveStatus: null,
    exportInfo: null,
    longPressTimer: 0,
    longPressStart: null,
    ctx: null,
    ctxPrevFocus: null,
    ctxOpenedAt: 0,
    hold: null,
  };

  document.addEventListener('DOMContentLoaded', init);

  /* ------------------------------------------------------------------ */
  /* boot                                                                */
  /* ------------------------------------------------------------------ */

  function init() {
    CM.store.init();
    loadUI();
    ensureSession();
    ensureComposer();
    CM.store.onStatus = onSaveStatus;
    bind();
    renderAll();
    onSaveStatus({ ok: true, bytes: CM.store.bytes(), at: new Date() });
    CM.i18n.onChange(onLanguageChange);
    if (!CM.store.available) {
      toast(tr('浏览器本地存储不可用，修改只留在当前页面', 'Browser local storage is unavailable; changes stay on this page only'), true);
    }
  }

  /** Re-render every dynamic surface after a zh/en switch. Static markup is
      handled by CM.i18n.apply(); here we rebuild templates and open dialogs. */
  function onLanguageChange() {
    closeContextMenu();
    renderAll();
    if (S.saveStatus) onSaveStatus(S.saveStatus);
    if (S.modalKind === 'export') {
      openExport();
    } else if (S.modalKind === 'character') {
      openCharacterModal(S.modalUid, false);
    } else if (S.modalKind === 'confirm' && S.confirmOpts) {
      openConfirmModal(S.confirmOpts);
    }
  }

  function loadUI() {
    try {
      const raw =
        localStorage.getItem(CM.UI_KEY) ||
        localStorage.getItem(CM.LEGACY_UI_KEY) ||
        '{}';
      if (!localStorage.getItem(CM.UI_KEY) && raw !== '{}') {
        try {
          localStorage.setItem(CM.UI_KEY, raw);
        } catch (e) {}
      }
      const ui = JSON.parse(raw);
      if (ui.sessionId && D().sessions.some((s) => s.id === ui.sessionId)) S.sessionId = ui.sessionId;
      if (ui.composerUid) S.composerUid = String(ui.composerUid);
    } catch (e) {}
  }

  function saveUI() {
    try {
      localStorage.setItem(
        CM.UI_KEY,
        JSON.stringify({ sessionId: S.sessionId, composerUid: S.composerUid })
      );
    } catch (e) {}
  }

  function D() {
    return CM.store.data;
  }

  function session() {
    const d = D();
    return d.sessions.find((s) => s.id === S.sessionId) || d.sessions[0];
  }

  function findSession(d, id) {
    return (d.sessions || []).find((s) => s.id === id);
  }

  function findEventById(d, id) {
    for (const s of d.sessions || []) {
      const ev = (s.events || []).find((e) => e.id === id);
      if (ev) return ev;
    }
    return null;
  }

  function currentEvent() {
    const s = session();
    if (!s || !S.selectedId) return null;
    return (s.events || []).find((e) => e.id === S.selectedId) || null;
  }

  function ensureSession() {
    const d = D();
    if (!d.sessions.some((s) => s.id === S.sessionId)) S.sessionId = d.sessions[0].id;
  }

  function allowedChars(s) {
    const d = D();
    if (!s || s.detail_type !== 'private') return d.characters;
    const ids = new Set([String(CM.selfId(d)), String(s.user_id || '')]);
    return d.characters.filter((c) => ids.has(String(c.user_id)));
  }

  function ensureComposer() {
    const s = session();
    const allowed = allowedChars(s);
    if (!S.composerUid || !allowed.some((c) => String(c.user_id) === String(S.composerUid))) {
      S.composerUid = CM.selfId(D());
    }
  }

  function selfChar() {
    return CM.charOf(D(), CM.selfId(D())) || { name: tr('我', 'Me'), avatar: '🙂', color: '#93b4ff' };
  }

  function avatarHTML(ch) {
    if (!ch) return '🙂';
    if (ch.avatarImage) return `<img src="${esc(ch.avatarImage)}" alt="">`;
    return esc(ch.avatar || '🙂');
  }

  function randomGroupId() {
    return String(100000000 + Math.floor(Math.random() * 899999999));
  }

  function firstOtherId(d) {
    const self = CM.selfId(d);
    const c = (d.characters || []).find((x) => String(x.user_id) !== String(self));
    return c ? c.user_id : self;
  }

  function shortTime(ts) {
    const d = new Date(ts * 1000);
    const now = new Date();
    if (d.toDateString() === now.toDateString()) return CM.fmtClock(ts);
    if (d.getFullYear() === now.getFullYear()) return d.getMonth() + 1 + '/' + d.getDate();
    return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate();
  }

  function recalledSet(s) {
    const set = new Set();
    (s.events || []).forEach((ev) => {
      if (ev.type === 'notice' && ev.detail_type === 'group_message_delete' && ev.message_id) {
        set.add(String(ev.message_id));
      }
    });
    return set;
  }

  function isEmptyMessage(ev) {
    if (!ev || ev.type !== 'message') return false;
    return (ev.message || []).every(
      (seg) => seg.type === 'text' && !String((seg.data && seg.data.text) || '').trim()
    );
  }

  /* ------------------------------------------------------------------ */
  /* global render                                                       */
  /* ------------------------------------------------------------------ */

  function renderAll(opts) {
    opts = opts || {};
    ensureSession();
    ensureComposer();
    if (S.selectedId && !findEventById(D(), S.selectedId)) S.selectedId = null;

    const drawerOpen = document.body.classList.contains('drawer-open');
    const drawerScroll = drawerOpen && $('#drawer-body') ? $('#drawer-body').scrollTop : 0;

    renderTopbar();
    renderPhoneChrome();
    renderPool();
    renderDetail();
    updateComposer();
    if (drawerOpen) {
      renderDrawer();
      const db = $('#drawer-body');
      if (db) db.scrollTop = drawerScroll;
    }
    if (!opts.skipPreview) schedulePreview();
  }

  function renderTopbar() {
    const st = D().settings;
    $$('[data-action="set-platform"]').forEach((b) =>
      b.classList.toggle('active', b.dataset.platform === st.platform)
    );
    const mi = $('#mode-icon');
    if (mi) mi.textContent = st.mode === 'dark' ? '☀' : '☾';
    updateUndoButtons();
  }

  function updateUndoButtons() {
    $$('[data-action="undo"]').forEach((b) => (b.disabled = !CM.store.canUndo()));
    $$('[data-action="redo"]').forEach((b) => (b.disabled = !CM.store.canRedo()));
  }

  function renderPhoneChrome() {
    const st = D().settings;
    const s = session();
    const phone = $('#phone');
    if (phone) {
      phone.dataset.platform = st.platform;
      phone.dataset.mode = st.mode;
    }
    const title = $('#chat-title');
    if (title) title.textContent = s.title || tr('未命名会话', 'Untitled chat');
    let sub = '';
    if (st.platform === 'qq') {
      sub =
        s.detail_type === 'group'
          ? s.member_count
            ? tr('{n}人', '{n} members', { n: s.member_count })
            : tr('群聊', 'Group chat')
          : tr('在线', 'Online');
    }
    const subEl = $('#chat-sub');
    if (subEl) subEl.textContent = sub;

    const last = CM.sessionLastTime(s);
    const t = /^\d{1,2}:\d{2}$/.test(st.statusTime || '')
      ? st.statusTime
      : CM.fmtClock(last || CM.nowSec());
    const sb = $('#sb-time');
    if (sb) sb.textContent = t;

    const screen = $('#phone-screen');
    if (screen) screen.style.background = st.backgroundTint || CM.theme(st).bg;
  }

  function renderPool() {
    const s = session();
    const d = D();
    const counts = {};
    (s.events || []).forEach((ev) => {
      if (ev.type === 'message') counts[ev.user_id] = (counts[ev.user_id] || 0) + 1;
    });
    const allowed = new Set(allowedChars(s).map((c) => String(c.user_id)));
    const html = d.characters
      .map((c) => {
        const isSelf = String(c.user_id) === String(CM.selfId(d));
        const active = String(c.user_id) === String(S.composerUid);
        const canSend = allowed.has(String(c.user_id));
        return `<div class="pool-card${active ? ' active' : ''}" draggable="true" data-action="pick-composer-role" data-uid="${esc(c.user_id)}" title="${esc(tr('点击设为输入身份；拖到聊天页直接插入消息', 'Click to set as input identity; drag into the chat to insert a message'))}">
          <span class="pool-avatar" style="background:${esc(c.color)}">${avatarHTML(c)}</span>
          <span class="pool-meta">
            <span class="pool-name"><span data-char-name="${esc(c.user_id)}">${esc(c.name)}</span>${isSelf ? `<span class="pool-tag">${esc(tr('本人', 'You'))}</span>` : ''}</span>
            <span class="pool-id">#${esc(c.user_id)} · ${esc(tr('{n} 条', '{n} msg', { n: counts[c.user_id] || 0 }))}${canSend ? '' : ' · ' + esc(tr('仅查看', 'View only'))}</span>
          </span>
          <button type="button" class="pool-edit" data-action="edit-character" data-uid="${esc(c.user_id)}" aria-label="${esc(tr('编辑角色', 'Edit character'))}" title="${esc(tr('编辑角色', 'Edit character'))}">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" aria-hidden="true">
              <path d="M4 20h4l10.5-10.5a2.1 2.1 0 0 0-3-3L5 17v3Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
              <path d="m14 8 2 2" stroke="currentColor" stroke-width="1.7"/>
            </svg>
          </button>
        </div>`;
      })
      .join('');
    const box = $('#character-pool');
    if (box) box.innerHTML = html;
  }

  function updateComposer() {
    const s = session();
    const allowed = allowedChars(s);
    if (!allowed.some((c) => String(c.user_id) === String(S.composerUid))) {
      S.composerUid = CM.selfId(D());
    }
    const ch = CM.charOf(D(), S.composerUid) || selfChar();
    const av = $('#role-avatar');
    if (av) {
      av.innerHTML = avatarHTML(ch);
      av.style.background = ch.color || '#eef2f8';
    }
    const roleBtn = $('#role-btn');
    if (roleBtn) roleBtn.title = tr('当前身份：{name}（点击切换）', 'Current identity: {name} (click to change)', { name: ch.name });
    const input = $('#composer-input');
    if (input) input.placeholder = tr('以 {name} 的身份输入…', 'Type as {name}…', { name: ch.name });
    const send = $('#composer-send') || $('.composer-send');
    if (send && input) send.disabled = !input.value.trim();
    if (S.rolePopOpen) renderRolePop();
  }

  function updateDetailSub() {
    const ev = currentEvent();
    const s = session();
    const el = $('#dh-sub');
    if (!ev || !el) return;
    const idx = (s.events || []).indexOf(ev);
    const fresh = S.freshEventId === ev.id;
    el.textContent =
      CM.fmtAbs(ev.time) +
      ' · ' +
      (ev.type === 'notice'
        ? tr('通知事件', 'Notice event')
        : s.detail_type === 'group'
        ? tr('群聊', 'Group chat')
        : tr('私聊', 'Private chat')) +
      ' · ' +
      (idx + 1) +
      '/' +
      s.events.length +
      (fresh ? ' · ' + tr('新消息', 'New') : '');
  }

  /* ------------------------------------------------------------------ */
  /* detail                                                              */
  /* ------------------------------------------------------------------ */

  function renderDetail() {
    const s = session();
    const ev = currentEvent();
    const head = $('#detail-head');
    const body = $('#detail-body');
    if (!head || !body) return;
    if (!ev) {
      renderEmptyDetail(head, body, s);
      return;
    }
    if (ev.type === 'notice') renderNoticeDetail(head, body, ev, s);
    else renderMessageDetail(head, body, ev, s);
    body.scrollTop = 0;
  }

  function detailActions(ev, s, extra) {
    const idx = (s.events || []).indexOf(ev);
    return `<div class="dh-actions">
      <button type="button" class="btn btn-sm" data-action="move-event" data-dir="-1" ${idx === 0 ? 'disabled' : ''} title="${esc(tr('上移', 'Move up'))}">↑</button>
      <button type="button" class="btn btn-sm" data-action="move-event" data-dir="1" ${idx === s.events.length - 1 ? 'disabled' : ''} title="${esc(tr('下移', 'Move down'))}">↓</button>
      <button type="button" class="btn btn-sm" data-action="duplicate-event" title="${esc(tr('复制', 'Duplicate'))}">${esc(tr('复制', 'Duplicate'))}</button>
      <button type="button" class="btn btn-sm btn-danger" data-action="delete-event" title="${esc(tr('删除', 'Delete'))}">${esc(tr('删除', 'Delete'))}</button>
      <button type="button" class="icon-btn sm" data-action="close-detail" title="${esc(tr('关闭详细编辑', 'Close detailed editor'))}" aria-label="${esc(tr('关闭详细编辑', 'Close detailed editor'))}">×</button>
    </div>`;
  }

  function renderMessageDetail(head, body, ev, s) {
    const ch = CM.charOf(D(), ev.user_id);
    const fresh = S.freshEventId === ev.id;
    head.innerHTML = `
      <span class="dh-avatar" style="background:${ch ? esc(ch.color) : '#dfe4eb'}">${avatarHTML(ch)}</span>
      <div class="dh-main">
        <div class="dh-title"><span data-char-name="${esc(ev.user_id)}">${esc(CM.charName(D(), ev.user_id))}</span> · ${esc(tr('消息', 'Message'))}${fresh ? ' · ' + esc(tr('新消息', 'New')) : ''}</div>
        <div class="dh-sub" id="dh-sub">${esc(CM.fmtAbs(ev.time))} · ${esc(s.detail_type === 'group' ? tr('群聊', 'Group chat') : tr('私聊', 'Private chat'))} · ${esc(tr('第 {n}/{total} 条', 'Item {n}/{total}', { n: s.events.indexOf(ev) + 1, total: s.events.length }))}</div>
      </div>
      ${detailActions(ev, s)}`;

    const segs = ev.message || [];
    const segHTML = segs.length
      ? segs.map((seg, i) => segmentEditor(seg, i, ev, s)).join('')
      : `<div class="seg-note" style="padding:9px 2px">${esc(tr('这条消息还没有内容。添加一个消息段，或直接在输入框里发送文字。', 'This message is still empty. Add a segment, or type in the composer.'))}</div>`;
    const gap = gapText(ev, s);
    body.innerHTML = `
      ${fresh ? `<div class="empty-hero" style="margin-bottom:12px;border-style:solid;padding:9px 10px"><div class="empty-icon" style="width:30px;height:30px;font-size:14px">＋</div><div><h3 style="font-size:12px">${esc(tr('正在编辑一条新消息', 'Editing a new message'))}</h3><p style="font-size:10px">${esc(tr('关闭时如果仍然为空，会自动从聊天里移除。', 'If it is still empty when closed, it will be removed from the chat.'))}</p></div></div>` : ''}
      <div class="meta-grid">
        <label class="field"><span>${esc(tr('发送者（user_id）', 'Sender (user_id)'))}</span><select class="select" data-bind="event.user_id">${charOptions(ev.user_id, s, true)}</select></label>
        <label class="field"><span>${esc(tr('时间（本地时间）', 'Time (local)'))}</span><input class="input" type="datetime-local" step="60" data-bind="event.time" value="${CM.toLocalInput(ev.time)}"></label>
      </div>
      <div class="meta-note">${esc(gap)} · OneBot 12 ${esc(tr('消息事件', 'message event'))} · message_id ${esc(ev.message_id)}</div>

      <div class="section-label" style="margin-top:13px">${esc(tr('消息段', 'Segments'))} <span class="count">${segs.length}</span></div>
      ${segHTML}
      ${segAddBar()}
      <div class="seg-note" style="margin-top:9px">${esc(tr('仅使用 OneBot 12 定义的消息段；图片、语音、文件等素材的名称 / 大小 / 时长存在本地文件表里，事件中只保留 file_id。', 'Only OneBot 12 segments are used; asset name / size / duration for images, voice and files live in the local file table, and events keep only file_id.'))}</div>
      <details class="json-block"><summary>${esc(tr('查看 OneBot 12 事件 JSON', 'View OneBot 12 event JSON'))}</summary><pre>${esc(JSON.stringify(ev, null, 2))}</pre></details>`;
  }

  function renderNoticeDetail(head, body, ev, s) {
    const meta = CM.NOTICE_META[ev.detail_type];
    const label = CM.noticeLabel(ev.detail_type);
    head.innerHTML = `
      <span class="dh-avatar" style="background:#eaf4ff;color:#0b84ff;font-weight:800">!</span>
      <div class="dh-main">
        <div class="dh-title">${esc(tr('系统提示 · {label}', 'System notice · {label}', { label }))}</div>
        <div class="dh-sub" id="dh-sub">${esc(CM.fmtAbs(ev.time))} · OneBot ${esc(tr('通知事件', 'notice event'))} · ${esc(ev.detail_type)}</div>
      </div>
      ${detailActions(ev, s)}`;

    const types = Object.keys(CM.NOTICE_META);
    if (!types.includes(ev.detail_type)) types.push(ev.detail_type);
    const subTypes = (meta ? meta.subTypes : []).slice();
    if (ev.sub_type && !subTypes.includes(ev.sub_type)) subTypes.push(ev.sub_type);
    const msgOptions = (s.events || [])
      .filter((e) => e.type === 'message')
      .map(
        (e) =>
          `<option value="${esc(e.message_id)}" ${String(e.message_id) === String(ev.message_id) ? 'selected' : ''}>${esc(CM.fmtClock(e.time))} ${esc(CM.charName(D(), e.user_id))}：${esc(truncate(CM.altMessage(e.message, D()), 26))}</option>`
      )
      .join('');
    body.innerHTML = `
      <div class="inline-fields">
        <label class="field"><span>detail_type</span><select class="select" data-bind="notice.detail_type">${types.map((t) => `<option value="${esc(t)}" ${t === ev.detail_type ? 'selected' : ''}>${esc(CM.noticeLabel(t))}</option>`).join('')}</select></label>
        <label class="field"><span>sub_type</span><select class="select" data-bind="notice.sub_type"><option value="" ${!ev.sub_type ? 'selected' : ''}>${esc(tr('（空）', '(empty)'))}</option>${subTypes.map((t) => `<option value="${esc(t)}" ${t === ev.sub_type ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></label>
        <label class="field"><span>${esc(tr('成员 user_id', 'Member user_id'))}</span><select class="select" data-bind="notice.user_id">${charOptions(ev.user_id, s, true)}</select></label>
        <label class="field"><span>${esc(tr('操作者 operator_id', 'Operator operator_id'))}</span><select class="select" data-bind="notice.operator_id">${charOptions(ev.operator_id, s, true)}</select></label>
        <label class="field"><span>${esc(tr('时间（本地）', 'Time (local)'))}</span><input class="input" type="datetime-local" step="60" data-bind="notice.time" value="${CM.toLocalInput(ev.time)}"></label>
        ${ev.detail_type === 'group_message_delete' ? `<label class="field"><span>${esc(tr('目标 message_id', 'Target message_id'))}</span><select class="select" data-bind="notice.message_id"><option value="">${esc(tr('选择消息…', 'Choose a message…'))}</option>${msgOptions}</select></label>` : ''}
      </div>
      <div class="seg-note" style="margin-top:10px">${esc(tr('标准 OneBot 12 群通知事件，在聊天页里渲染成居中的系统提示。', 'Standard OneBot 12 group notice event, rendered as a centered system message in the chat.'))}</div>
      <details class="json-block"><summary>${esc(tr('查看 OneBot 12 事件 JSON', 'View OneBot 12 event JSON'))}</summary><pre>${esc(JSON.stringify(ev, null, 2))}</pre></details>`;
  }

  function renderEmptyDetail(head, body, s) {
    head.innerHTML = `
      <span class="dh-avatar" style="background:#eef4ff;color:#0b84ff;font-size:17px">⌁</span>
      <div class="dh-main">
        <div class="dh-title">${esc(tr('详细编辑器', 'Detailed editor'))}</div>
        <div class="dh-sub">${esc(tr('选一条消息，或长按输入框新建', 'Select a message, or long-press the input to create one'))}</div>
      </div>`;
    const events = s.events || [];
    const recalled = recalledSet(s);
    const rows = events.length
      ? events
          .map((ev) => {
            const active = ev.id === S.selectedId;
            if (ev.type === 'notice') {
              return `<div class="flow-row${active ? ' active' : ''}" data-action="select-event" data-eid="${esc(ev.id)}">
                <span class="flow-time">${esc(shortTime(ev.time))}</span>
                <span class="flow-main"><span class="flow-who">${esc(tr('系统', 'System'))}</span> <span class="flow-text">${esc(truncate(CM.noticeText(D(), ev), 40))}</span></span>
                <span class="flow-kind">${esc(tr('通知', 'Notice'))}</span>
              </div>`;
            }
            const text = CM.altMessage(ev.message, D());
            const isRecalled = recalled.has(String(ev.message_id));
            return `<div class="flow-row${active ? ' active' : ''}" data-action="select-event" data-eid="${esc(ev.id)}">
              <span class="flow-time">${esc(shortTime(ev.time))}</span>
              <span class="flow-main"><span class="flow-who">${esc(CM.charName(D(), ev.user_id))}</span> <span class="flow-text">${esc(isRecalled ? tr('（已撤回）', '(recalled)') : truncate(text, 44) || tr('（空消息）', '(empty message)'))}</span></span>
              <span class="flow-kind">${esc(isRecalled ? tr('已撤回', 'Recalled') : tr('消息', 'Message'))}</span>
            </div>`;
          })
          .join('')
      : `<div class="seg-note" style="padding:10px 2px">${esc(tr('还没有消息。把角色拖到聊天页，或在下面新建一条。', 'No messages yet. Drag a character into the chat, or create one below.'))}</div>`;

    body.innerHTML = `
      <div class="detail-empty">
        <div class="empty-hero">
          <div class="empty-icon">＋</div>
          <div>
            <h3>${esc(tr('从聊天页开始编排', 'Compose from the chat page'))}</h3>
            <p>${esc(tr('输入框打字 + 发送就是直接编排；长按输入框进入这里的详细编辑，可以逐段添加图片、表情、语音、文件、位置和回复。所有字段只使用 OneBot 12 定义的内容。', 'Type and send in the composer to compose directly; long-press the input to open this detailed editor and add images, faces, voice, files, locations and replies segment by segment. All fields follow the OneBot 12 definitions.'))}</p>
          </div>
        </div>
        <div class="quick-actions">
          <button type="button" class="btn btn-sm btn-primary" data-action="new-message">${esc(tr('＋ 新建一条消息', '+ New message'))}</button>
          <button type="button" class="btn btn-sm" data-action="add-notice" ${s.detail_type === 'group' ? '' : 'disabled'}>${esc(tr('＋ 系统提示', '+ System notice'))}</button>
          <button type="button" class="btn btn-sm" data-action="sort-events">${esc(tr('按时间排序', 'Sort by time'))}</button>
        </div>
        <div class="meta-note">${esc(s.detail_type === 'group' ? tr('群聊', 'Group chat') : tr('私聊', 'Private chat'))} · ${s.detail_type === 'group' ? esc(tr('群号 {id}', 'Group ID {id}', { id: s.group_id || '—' })) + ' · ' + esc(tr('{n} 人', '{n} members', { n: s.member_count || 0 })) : esc(tr('对象 {name}', 'Peer {name}', { name: CM.charName(D(), s.user_id) }))} · ${esc(tr('{n} 个事件', '{n} events', { n: events.length }))}</div>
        <div class="section-label" style="margin-top:13px">${esc(tr('消息流', 'Message flow'))} <span class="count">${events.length}</span></div>
        <div class="flow">${rows}</div>
      </div>`;
  }

  function segmentEditor(seg, i, ev, s) {
    const d = (seg && seg.data) || {};
    const meta = CM.SEGMENT_META[seg.type] || { standard: false };
    const files = D().files || {};
    let body = '';
    let note = '';
    let spec = '';

    switch (seg.type) {
      case 'text':
        spec = 'data.text';
        body = `<textarea class="input" rows="3" data-esi="${i}" data-seg-field="text" placeholder="${esc(tr('输入文本，可换行', 'Type text; line breaks are allowed'))}">${esc(d.text || '')}</textarea>`;
        break;
      case 'mention':
        spec = 'data.user_id';
        body = `<label class="field"><span>${esc(tr('被提及的用户 user_id', 'Mentioned user user_id'))}</span><select class="select" data-esi="${i}" data-seg-field="user_id">${charOptions(d.user_id, s, true)}</select></label>`;
        note = tr('渲染为 @昵称；事件里只保存 user_id。', 'Rendered as @name; the event stores only user_id.');
        break;
      case 'mention_all':
        spec = tr('无参数', 'No parameters');
        body = `<div class="seg-note" style="margin-top:0">${esc(tr('标准消息段 mention_all，不带参数。', 'Standard mention_all segment with no parameters.'))}</div>`;
        break;
      case 'image': {
        spec = 'data.file_id';
        const f = files[d.file_id] || {};
        body = `<div class="media-edit">
          <div class="media-thumb">${f.dataUrl ? `<img src="${esc(f.dataUrl)}" alt="">` : esc(tr('无图', 'No image'))}</div>
          <div class="media-info">
            <div class="file-name">${esc(f.name || tr('未选择图片', 'No image selected'))}</div>
            <div class="mono">file_id: ${esc(d.file_id || '—')} · ${esc(CM.fmtBytes(f.size || 0))}</div>
            <div class="media-actions"><button type="button" class="chip-btn" data-action="pick-image" data-esi="${i}">${esc(tr('选择 / 替换图片', 'Choose / replace image'))}</button></div>
          </div>
        </div>`;
        note = tr('图片会压缩成 WebP 后存进本地文件表；消息段只带 file_id。', 'Images are compressed to WebP in the local file table; the segment only carries file_id.');
        break;
      }
      case 'voice': {
        spec = 'data.file_id';
        const f = files[d.file_id] || {};
        body = `<label class="field"><span>${esc(tr('时长（秒）', 'Duration (s)'))}</span><input class="input" type="number" min="1" max="60" step="1" data-esi="${i}" data-file-meta="duration" value="${Number(f.duration) || 3}"></label>`;
        note = tr('voice 段只保存 file_id；时长属于本地素材信息，不写进事件。', 'The voice segment stores only file_id; duration is local asset metadata and is not written into the event.');
        break;
      }
      case 'audio':
      case 'video': {
        spec = 'data.file_id';
        const f = files[d.file_id] || {};
        body = `<div class="inline-fields">
          <label class="field span-2"><span>${esc(tr('名称', 'Name'))}</span><input class="input" data-esi="${i}" data-file-meta="name" value="${esc(f.name || (seg.type === 'video' ? tr('视频', 'Video') : tr('音频', 'Audio')))}"></label>
          <label class="field"><span>${esc(tr('时长（秒）', 'Duration (s)'))}</span><input class="input" type="number" min="0" max="3600" step="1" data-esi="${i}" data-file-meta="duration" value="${Number(f.duration) || 0}"></label>
        </div>`;
        break;
      }
      case 'file': {
        spec = 'data.file_id';
        const f = files[d.file_id] || {};
        body = `<div class="inline-fields">
          <label class="field span-2"><span>${esc(tr('文件名', 'File name'))}</span><input class="input" data-esi="${i}" data-file-meta="name" value="${esc(f.name || '')}"></label>
          <label class="field"><span>${esc(tr('大小（KB）', 'Size (KB)'))}</span><input class="input" type="number" min="0" step="0.1" data-esi="${i}" data-file-meta="sizeKb" value="${((Number(f.size) || 0) / 1024).toFixed(1)}"></label>
        </div>`;
        break;
      }
      case 'location':
        spec = 'data.latitude / longitude / title / content';
        body = `<div class="inline-fields">
          <label class="field span-2"><span>${esc(tr('标题', 'Title'))}</span><input class="input" data-esi="${i}" data-seg-field="title" value="${esc(d.title || '')}"></label>
          <label class="field span-2"><span>${esc(tr('地址', 'Address'))}</span><input class="input" data-esi="${i}" data-seg-field="content" value="${esc(d.content || '')}"></label>
          <label class="field"><span>${esc(tr('纬度', 'Latitude'))}</span><input class="input" type="number" step="0.000001" data-esi="${i}" data-seg-field="latitude" value="${Number(d.latitude) || 0}"></label>
          <label class="field"><span>${esc(tr('经度', 'Longitude'))}</span><input class="input" type="number" step="0.000001" data-esi="${i}" data-seg-field="longitude" value="${Number(d.longitude) || 0}"></label>
        </div>`;
        break;
      case 'reply':
        spec = 'data.message_id / user_id';
        body = `<label class="field"><span>${esc(tr('回复的消息', 'Replied message'))}</span><select class="select" data-esi="${i}" data-seg-field="message_id">${replyOptions(ev, s, d.message_id)}</select></label>`;
        note = tr('reply 段同时保存 message_id 与 user_id，渲染成引用块。', 'The reply segment stores both message_id and user_id and renders as a quote block.');
        break;
      case 'qq.face': {
        spec = 'data.id';
        const face = CM.faceOf(d.id);
        body = `<div class="inline-fields">
          <label class="field"><span>${esc(tr('QQ 表情', 'QQ face'))}</span><select class="select" data-esi="${i}" data-seg-field="id">${CM.FACES.map((f) => `<option value="${f.id}" ${String(f.id) === String(d.id) ? 'selected' : ''}>${f.emoji} ${esc(CM.faceName(f.id))} · ${f.id}</option>`).join('')}</select></label>
          <div class="face-preview"><span class="emoji">${face.emoji}</span><span class="seg-note" style="margin:0">${esc(CM.faceName(d.id))} · id ${esc(face.id)}</span></div>
        </div>`;
        note = tr('扩展消息段，命名符合 OneBot 扩展规则（qq.face）。', 'Extended segment named per the OneBot extension rule (qq.face).');
        break;
      }
      default:
        spec = tr('未知扩展', 'Unknown extension');
        body = `<div class="seg-note" style="margin-top:0">${esc(tr('扩展消息段 {type}，本工具只渲染已知类型。', 'Extended segment {type}; this tool renders known types only.', { type: seg.type }))}</div>`;
    }

    return `<div class="seg">
      <div class="seg-head">
        <span class="seg-type ${meta.standard ? '' : 'ext'}">${esc(CM.segLabel(seg.type))}</span>
        <span class="seg-spec">${esc(spec)}</span>
        <div class="seg-tools">
          <button type="button" class="icon-btn sm" data-action="seg-up" data-esi="${i}" title="${esc(tr('上移消息段', 'Move segment up'))}">↑</button>
          <button type="button" class="icon-btn sm" data-action="seg-down" data-esi="${i}" title="${esc(tr('下移消息段', 'Move segment down'))}">↓</button>
          <button type="button" class="icon-btn sm" data-action="del-seg" data-esi="${i}" title="${esc(tr('删除消息段', 'Delete segment'))}">×</button>
        </div>
      </div>
      <div class="seg-body">${body}${note ? `<div class="seg-note">${esc(note)}</div>` : ''}</div>
    </div>`;
  }

  function segAddBar() {
    return `<div class="seg-add">
      <span class="seg-add-label">${esc(tr('添加消息段', 'Add segment'))}</span>
      <button type="button" class="chip-btn add" data-action="add-seg" data-type="text">${esc(tr('＋ 文本', '+ Text'))}</button>
      <button type="button" class="chip-btn add" data-action="add-seg" data-type="image">${esc(tr('＋ 图片', '+ Image'))}</button>
      <button type="button" class="chip-btn add" data-action="add-seg" data-type="qq.face">${esc(tr('＋ 表情', '+ Face'))}</button>
      <button type="button" class="chip-btn add" data-action="add-seg" data-type="mention">${esc(tr('＋ @', '+ @'))}</button>
      <select class="select" data-action="add-seg-select">

  function charOptions(selected, s, includeCurrent) {
    let list = allowedChars(s).slice();

      list.push({ user_id: id, name: tr('用户 {id}', 'User {id}', { id }), avatar: '🙂', color: '#dfe4eb' });

  function replyOptions(ev, s, selected) {
    const list = (s.events || []).filter((e) => e.type === 'message' && e.id !== ev.id);
    if (!list.length) return `<option value="">${esc(tr('没有可回复的消息', 'No messages to reply to'))}</option>`;
    return (
      `<option value="">${esc(tr('选择一条消息…', 'Choose a message…'))}</option>` +
      list
        .map(
          (e) =>
            `<option value="${esc(e.message_id)}" ${String(e.message_id) === String(selected) ? 'selected' : ''}>${esc(CM.fmtClock(e.time))} ${esc(CM.charName(D(), e.user_id))}：${esc(truncate(CM.altMessage(e.message, D()), 24))}</option>`
        )
        .join('')
    );
  }

  function gapText(ev, s) {
    const idx = (s.events || []).indexOf(ev);
    if (idx <= 0) return tr('会话中的第一条事件', 'First event in this conversation');
    const diff = (ev.time - s.events[idx - 1].time) / 60;
    const gap = diff < 0 ? '—' : tr('{n} 分钟', '{n} min', { n: Math.round(diff) });
    return tr('距上一条 {gap}', 'Gap after previous event: {gap}', { gap });
  }

  function truncate(str, n) {
    const text = String(str == null ? '' : str).replace(/\s+/g, ' ').trim();
    return Array.from(text).length > n ? Array.from(text).slice(0, n).join('') + '…' : text;
  }

  const schedulePreview = CM.debounce(() => renderPreview(), 60);

  async function renderPreview() {
    const token = ++S.previewToken;
    const s = session();
    if (!s) return null;
    const canvas = $('#preview-canvas');
    const wrap = $('#canvas-wrap');
    if (!canvas || !wrap) return null;
    const cssW = wrap.clientWidth || 390;
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    const scale = Math.max(0.5, (cssW / CM.DESIGN_WIDTH) * dpr);
    try {
      const layout = await CM.render.render(canvas, D(), s, {
        scale,
        selectedId: S.selectedId || '',
        includeHeader: false,
        includeStatus: false,
      });
      if (token !== S.previewToken) return null;
      S.previewLayout = layout;
      const meta = $('#preview-meta');
      if (meta) meta.textContent = '390 × ' + Math.round(layout.height + 94);
      return layout;
    } catch (err) {
      console.error(err);
      toast(err && err.message ? err.message : tr('预览绘制失败', 'Preview render failed'), true);
      return null;
    }
  }

  function scrollPreviewToEvent(id) {
    const layout = S.previewLayout;
    const canvas = $('#preview-canvas');
    const screen = $('#phone-screen');
    if (!layout || !canvas || !screen || !layout.session || layout.session.id !== session().id) return;
    const item = layout.items.find((i) => i.eventId === id);
    if (!item) return;
    const k = canvas.clientHeight / layout.height;
    const top = Math.max(0, item.y * k - 56);
    screen.scrollTo({ top, behavior: 'smooth' });
  }

  function scrollToBottom() {
    const screen = $('#phone-screen');
    if (!screen) return;
    screen.scrollTo({ top: screen.scrollHeight, behavior: 'smooth' });
  }
